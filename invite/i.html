<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Հրավեր</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@300;400;600&family=Noto+Serif+Armenian:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf7f1;--card:#fff;--ink:#3b2f2a;--muted:#8a7b72;--accent:#b08d57;--soft:#f1e7d8}
body.t-garden{--bg:#f3f6f0;--ink:#2f3b2f;--muted:#6f7d6c;--accent:#6f8f5f;--soft:#e2ebdc}
body.t-night{--bg:#14161f;--card:#1d2030;--ink:#f1ece2;--muted:#a9a3b5;--accent:#d8b46a;--soft:#262a3d}
body.t-rose{--bg:#fdf3f4;--ink:#4a2a33;--muted:#9a7480;--accent:#c76b84;--soft:#f7dfe4}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Armenian",system-ui,sans-serif;font-weight:300;line-height:1.6}
.serif{font-family:"Noto Serif Armenian",Georgia,serif}
#cover{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .8s,visibility .8s}
#cover.hide{opacity:0;visibility:hidden}
.seal{width:110px;height:110px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:0 10px 30px rgba(0,0,0,.18);margin:26px 0;cursor:pointer;animation:pulse 2s infinite;border:none}
@keyframes pulse{50%{transform:scale(1.06)}}
.wrap{max-width:560px;margin:0 auto;padding:0 18px 60px}
section{padding:46px 0;text-align:center;border-bottom:1px solid var(--soft)}
.hero{min-height:92vh;display:flex;flex-direction:column;justify-content:center}
.kicker{letter-spacing:.25em;text-transform:uppercase;font-size:12px;color:var(--muted)}
.names{font-size:clamp(38px,11vw,62px);margin:14px 0;line-height:1.15;font-weight:600}
.names .amp{display:block;font-size:.55em;color:var(--accent)}
.date{font-size:20px;color:var(--accent)}
h2{font-family:"Noto Serif Armenian",serif;font-weight:600;font-size:26px;margin:0 0 18px}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.count div{background:var(--card);border-radius:14px;padding:14px 4px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.count b{display:block;font-size:28px;font-family:"Noto Serif Armenian",serif;color:var(--accent)}
.count span{font-size:12px;color:var(--muted)}
.place{background:var(--card);border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.place .time{font-size:24px;font-family:"Noto Serif Armenian",serif;color:var(--accent)}
.place h3{margin:4px 0;font-weight:600}
.place p{margin:4px 0;color:var(--muted)}
.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;border:none;border-radius:999px;padding:12px 24px;font:inherit;font-weight:600;cursor:pointer;margin:6px}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.timeline{list-style:none;padding:0;margin:0;text-align:left;display:inline-block}
.timeline li{padding:8px 0 8px 22px;border-left:2px solid var(--accent);position:relative}
.timeline li::before{content:"";position:absolute;left:-7px;top:15px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
.timeline b{color:var(--accent);margin-right:8px}
form{display:grid;gap:12px;text-align:left}
input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--soft);background:var(--card);color:var(--ink);font:inherit}
label{font-size:14px;color:var(--muted)}
.choice{display:flex;gap:8px}
.choice label{flex:1;background:var(--card);border:1px solid var(--soft);border-radius:12px;padding:12px;text-align:center;cursor:pointer;color:var(--ink)}
.choice input{display:none}
.choice input:checked+span{color:var(--accent);font-weight:600}
.dots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.dots i{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
#music{position:fixed;right:16px;bottom:16px;z-index:10;width:48px;height:48px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:20px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.2);display:none}
.reveal{opacity:0;transform:translateY(24px);transition:all .9s}
.reveal.on{opacity:1;transform:none}
footer{text-align:center;color:var(--muted);font-size:12px;padding:30px 0}
footer a{color:var(--muted)}
.photo{width:100%;border-radius:18px;margin-top:18px;object-fit:cover;max-height:520px}
</style>
</head>
<body>
<div id="cover">
  <div class="kicker">Դուք հրավիրված եք</div>
  <div class="names serif" id="cNames"></div>
  <button class="seal" id="open" aria-label="Բացել հրավերը">✉</button>
  <div style="color:var(--muted)">Սեղմեք՝ հրավերը բացելու համար</div>
</div>

<button id="music" aria-label="Երաժշտություն">♪</button>
<audio id="audio" loop></audio>

<main class="wrap">
  <section class="hero">
    <div class="kicker" id="hKicker"></div>
    <div class="names serif" id="hNames"></div>
    <div class="date serif" id="hDate"></div>
    <img class="photo" id="photo" alt="" hidden>
  </section>

  <section class="reveal" id="sText">
    <h2>Սիրելի՛ հյուրեր</h2>
    <p id="text"></p>
  </section>

  <section class="reveal">
    <h2>Մինչև մեծ օրը</h2>
    <div class="count">
      <div><b id="cd">0</b><span>օր</span></div>
      <div><b id="ch">0</b><span>ժամ</span></div>
      <div><b id="cm">0</b><span>րոպե</span></div>
      <div><b id="cs">0</b><span>վայրկյան</span></div>
    </div>
    <p><button class="btn ghost" id="ics">📅 Ավելացնել օրացույցում</button></p>
  </section>

  <section class="reveal" id="sPlaces"><h2>Որտե՞ղ</h2><div id="places"></div></section>

  <section class="reveal" id="sTimeline"><h2>Օրվա ծրագիրը</h2><ul class="timeline" id="timeline"></ul></section>

  <section class="reveal" id="sDress"><h2>Դրես-կոդ</h2><p id="dress"></p><div class="dots" id="dots"></div></section>

  <section class="reveal" id="sRsvp">
    <h2>Կմասնակցե՞ք</h2>
    <p id="rsvpNote" style="color:var(--muted)"></p>
    <form id="rsvp">
      <div><label>Անուն Ազգանուն</label><input name="name" required></div>
      <div class="choice">
        <label><input type="radio" name="go" value="yes" checked><span>Կգամ</span></label>
        <label><input type="radio" name="go" value="no"><span>Չեմ կարող</span></label>
      </div>
      <div><label>Քանի՞ հոգի</label><select name="n"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div>
      <div><label>Մեկնաբանություն</label><textarea name="msg" rows="2"></textarea></div>
      <button class="btn" type="submit">Ուղարկել պատասխանը</button>
    </form>
    <p id="rsvpDone" hidden class="serif" style="font-size:20px">Շնորհակալություն, Ձեր պատասխանը ստացվել է 💛</p>
  </section>

  <section class="reveal" style="border:none">
    <p class="serif" style="font-size:22px">Սիրով սպասում ենք Ձեզ</p>
    <div class="names serif" id="fNames" style="font-size:34px"></div>
  </section>
  <footer>Ստեղծված է <a href="/" id="brand">Hraver</a>-ով</footer>
</main>

<script>
// Data: from URL hash (#d=...) made by create.html, otherwise a demo.
const DEMO = {
  theme:"classic", type:"Հարսանյաց հրավեր",
  n1:"Արամ", n2:"Անի", date:"2027-06-12T15:00",
  text:"Մեր կյանքի ամենագեղեցիկ օրը մենք ցանկանում ենք կիսել Ձեզ հետ։ Սիրով հրավիրում ենք Ձեզ մեր հարսանյաց արարողությանը։",
  places:[
    {time:"15:00",title:"Պսակադրություն",name:"Սուրբ Աննա եկեղեցի",addr:"Երևան, Աբովյան 22",map:""},
    {time:"18:00",title:"Հարսանյաց խնջույք",name:"«Արարատ» ռեստորանային համալիր",addr:"Երևան",map:""}
  ],
  timeline:[["15:00","Պսակադրություն"],["17:00","Ֆոտոսեսիա"],["18:00","Խնջույքի մեկնարկ"],["21:00","Տորթ"]],
  dress:"Խնդրում ենք ընտրել պաստելային երանգներ", colors:["#e8d7c3","#c9b79c","#9fae9a","#f4e1e1"],
  rsvpType:"wa", rsvp:"37400000000", rsvpBy:"2027-05-20",
  music:"", photo:""
};
const SRV = window.__HRAVER || null; // set when served by the Hraver worker (/i/<id>)
let D = SRV ? Object.assign({places:[],timeline:[],colors:[]}, SRV.data) : DEMO;
if(!SRV) try{
  const m = location.hash.match(/d=([^&]+)/);
  if(m) D = Object.assign({}, DEMO, JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1]))))));
}catch(e){console.warn("bad data",e)}
const qTheme = new URLSearchParams(location.search).get("theme"); if(qTheme) D = Object.assign({}, D, {theme:qTheme});

const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MONTHS=["հունվարի","փետրվարի","մարտի","ապրիլի","մայիսի","հունիսի","հուլիսի","օգոստոսի","սեպտեմբերի","հոկտեմբերի","նոյեմբերի","դեկտեմբերի"];
const dt = new Date(D.date);
const fmt = d => `${d.getDate()} ${MONTHS[d.getMonth()]}, ${d.getFullYear()}`;

document.body.className = "t-"+(D.theme||"classic");
const namesHtml = D.n2 ? `${esc(D.n1)}<span class="amp">&</span>${esc(D.n2)}` : esc(D.n1);
$("cNames").innerHTML = $("hNames").innerHTML = namesHtml;
$("fNames").textContent = D.n2 ? `${D.n1} & ${D.n2}` : D.n1;
$("hKicker").textContent = D.type;
document.title = `${D.type} · ${D.n2 ? D.n1+" & "+D.n2 : D.n1}`;
if(!isNaN(dt)) $("hDate").textContent = `${fmt(dt)} · ${String(dt.getHours()).padStart(2,"0")}:${String(dt.getMinutes()).padStart(2,"0")}`;
if(D.photo){ $("photo").src = D.photo; $("photo").hidden = false; }
D.text ? $("text").textContent = D.text : $("sText").remove();

(D.places||[]).length ? $("places").innerHTML = D.places.map(p=>{
  const q = p.map || ("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent((p.name||"")+" "+(p.addr||"")));
  return `<div class="place"><div class="time">${esc(p.time)}</div><h3>${esc(p.title)}</h3><p><b>${esc(p.name)}</b></p><p>${esc(p.addr)}</p>
  <a class="btn ghost" href="${esc(q)}" target="_blank" rel="noopener">📍 Քարտեզ</a></div>`}).join("") : $("sPlaces").remove();

(D.timeline||[]).length ? $("timeline").innerHTML = D.timeline.map(t=>`<li><b>${esc(t[0])}</b>${esc(t[1])}</li>`).join("") : $("sTimeline").remove();

if(D.dress || (D.colors||[]).length){ $("dress").textContent = D.dress||""; $("dots").innerHTML=(D.colors||[]).map(c=>`<i style="background:${esc(c)}"></i>`).join(""); } else $("sDress").remove();

// Countdown
function tick(){
  let s = Math.max(0, Math.floor((dt - new Date())/1000));
  $("cd").textContent = Math.floor(s/86400); s%=86400;
  $("ch").textContent = Math.floor(s/3600); s%=3600;
  $("cm").textContent = Math.floor(s/60); $("cs").textContent = s%60;
}
if(!isNaN(dt)){ tick(); setInterval(tick,1000); }

// Calendar file
$("ics").onclick = () => {
  const z = d => d.toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  const end = new Date(dt.getTime()+6*3600e3);
  const loc = (D.places&&D.places[0]) ? `${D.places[0].name}, ${D.places[0].addr}` : "";
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Hraver//HY","BEGIN:VEVENT","UID:"+Date.now()+"@hraver",
    "DTSTAMP:"+z(new Date()),"DTSTART:"+z(dt),"DTEND:"+z(end),"SUMMARY:"+document.title,"LOCATION:"+loc,"END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics],{type:"text/calendar"})); a.download = "hraver.ics"; a.click();
};

// RSVP: WhatsApp or Telegram message to the hosts
if(D.rsvp){
  if(D.rsvpBy){ const b=new Date(D.rsvpBy); if(!isNaN(b)) $("rsvpNote").textContent = `Խնդրում ենք պատասխանել մինչև ${fmt(b)}`; }
  $("rsvp").onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    if(SRV){
      if(!SRV.paid){ alert("Սա նախադիտում է. պատասխանները կընդունվեն հրավերն ակտիվացնելուց հետո։"); return; }
      const btn = e.target.querySelector("button"); btn.disabled = true;
      const r = await fetch("/api/rsvp/"+SRV.id,{method:"POST",headers:{"content-type":"application/json"},
        body:JSON.stringify({name:f.get("name"),go:f.get("go")==="yes",n:f.get("n"),msg:f.get("msg")})}).then(r=>r.json()).catch(()=>({error:"Կապի սխալ"}));
      btn.disabled = false;
      if(r.error){ alert(r.error); return; }
      e.target.hidden = true; $("rsvpDone").hidden = false;
      try{ localStorage.setItem("rsvp_"+SRV.id,"1"); }catch(_){}
      return;
    }
    const msg = `${D.type} (${$("fNames").textContent})\nԱնուն՝ ${f.get("name")}\nՊատասխան՝ ${f.get("go")==="yes"?"Կգամ ✅":"Չեմ կարող գալ ❌"}\nՀյուրերի թիվ՝ ${f.get("n")}` + (f.get("msg")?`\nՄեկնաբանություն՝ ${f.get("msg")}`:"");
    const url = D.rsvpType==="tg"
      ? `https://t.me/${String(D.rsvp).replace(/^@/,"")}?text=${encodeURIComponent(msg)}`
      : `https://wa.me/${String(D.rsvp).replace(/\D/g,"")}?text=${encodeURIComponent(msg)}`;
    window.open(url,"_blank");
  };
  try{ if(SRV && localStorage.getItem("rsvp_"+SRV.id)){ $("rsvp").hidden = true; $("rsvpDone").hidden = false; } }catch(_){}
} else $("sRsvp").remove();
if(!SRV) $("brand").href = "./";
if(SRV && !SRV.paid){
  const b = document.createElement("div");
  b.textContent = "ՆԱԽԱԴԻՏՈՒՄ · ակտիվ կլինի վճարումից հետո";
  b.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:30;background:#c0392b;color:#fff;text-align:center;font-size:13px;padding:6px;font-weight:600;letter-spacing:.05em";
  document.body.appendChild(b);
}

// Opening + music
const audio = $("audio");
if(D.music){ audio.src = D.music; $("music").style.display="block"; }
$("music").onclick = () => audio.paused ? audio.play() : audio.pause();
$("open").onclick = () => { $("cover").classList.add("hide"); if(D.music) audio.play().catch(()=>{}); };

const io = new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add("on")),{threshold:.15});
document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
</script>
</body>
</html>
