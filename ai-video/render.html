<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;background:#0d0b1e}canvas{display:block}</style>
<canvas id="c" width="540" height="960"></canvas>
<script src="scenes.js"></script>

<script>
const W=540,H=960,cv=document.getElementById('c');let g=cv.getContext('2d');
const main=g,off=document.createElement('canvas');off.width=300;off.height=300;const og=off.getContext('2d');
const C={bg:'#0b0a1c',ink:'#f4f1ff',lime:'#b6ff3b',cyan:'#3de8ff',pink:'#ff5fa8',dim:'#6d64a8',panel:'#15123a',line:'#2b2566'};
const FONT='Arial Black, Liberation Sans, DejaVu Sans',FONT2='Arial, Liberation Sans, DejaVu Sans';
const clamp=(x,a=0,b=1)=>Math.min(Math.max(x,a),b);
const ease=t=>1-Math.pow(1-clamp(t),3);
const back=t=>{t=clamp(t);const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);}
function txt(s,x,y,size,col,w=900,align='center',font=FONT){g.font=`${w} ${size}px ${font}`;g.textAlign=align;g.fillStyle=col;g.fillText(s,x,y);}
function fit(s,maxW,size,w=900,font=FONT){g.font=`${w} ${size}px ${font}`;while(g.measureText(s).width>maxW&&size>18){size-=2;g.font=`${w} ${size}px ${font}`;}return size;}
const stroke=(c,w)=>{g.strokeStyle=c;g.lineWidth=w;g.lineCap='round';g.lineJoin='round';};

/* ================= ГЕРОЙ «ПИКС» (рисуется по сетке, позы параметрами) ================= */
const P={O:'#6f5fe8',B:'#3de8ff',L:'#c9fbff',D:'#1fa5c4',DD:'#1789a6',V:'#0e1238',E:'#f4feff',Y:'#b6ff3b',M:'#ff5fa8',K:'#251c66'};
function R(x,y,w,h,c,s){g.fillStyle=c;g.fillRect(x*s,y*s,w*s+.6,h*s+.6);}
function robot(s,t,o){ // o: {eyes,mouth,armL,armR,bob}
  const e=o.eyes||'open',m=o.mouth||'closed',al=o.armL||'down',ar=o.armR||'down';
  // тень рук/ног сзади
  // ноги
  R(7,25,3,3,P.O,s);R(8,25,1,2,P.D,s);R(13,25,3,3,P.O,s);R(14,25,1,2,P.D,s);
  R(6,28,5,2,P.K,s);R(12,28,5,2,P.K,s);R(7,28,3,1,P.O,s);R(13,28,3,1,P.O,s);
  // руки (позади корпуса)
  const arm=(side,pose)=>{const x0=side<0?1:19;
    const hand=(hx,hy)=>{R(hx-1,hy-1,4,4,P.O,s);R(hx,hy,2,2,P.Y,s);};
    if(pose==='down'){R(x0,18,3,7,P.O,s);R(x0+.5,18.5,1,6,P.B,s);hand(x0,24);}
    else if(pose==='up'){R(x0,11,3,8,P.O,s);R(x0+.5,11.5,1,7,P.B,s);hand(x0,9);}
    else if(pose==='point'){ // указывает вверх-вбок на иконку
      const d=side;R(x0,17,3,3,P.O,s);R(x0+d*2,14,3,4,P.O,s);R(x0+d*4,11,3,4,P.O,s);hand(x0+d*5+(d>0?0:-1),8);}
    else if(pose==='shrug'){R(x0+(side<0?-2:2),18,3,3,P.O,s);R(x0+(side<0?-4:4),15,3,4,P.O,s);hand(x0+(side<0?-5:5),13);}
    else if(pose==='wave'){const w=Math.sin(t*10)*1.2;R(x0,12,3,7,P.O,s);hand(x0+w,9);}
  };
  arm(-1,al);arm(1,ar);
  // корпус
  R(5,17,13,9,P.O,s);R(6,18,11,7,P.B,s);R(6,18,11,1,P.L,s);R(15,19,2,6,P.D,s);R(6,24,11,1,P.D,s);
  R(8,19,7,4,P.V,s);R(10,20,1,2,P.Y,s);R(12,20,1,2,P.Y,s);R(11,19.5,1,3,P.Y,s); // грудной экран
  // шея
  R(9,16,5,2,P.DD,s);
  // голова
  R(2,5,19,12,P.O,s);R(3,6,17,10,P.B,s);R(3,6,17,1,P.L,s);R(3,6,1,9,P.L,s);R(18,7,2,9,P.D,s);R(3,15,17,1,P.D,s);
  // ушки
  R(0,8,2,6,P.O,s);R(1,9,1,4,P.Y,s);R(21,8,2,6,P.O,s);R(21,9,1,4,P.Y,s);
  // антенна
  R(11,2,2,4,P.O,s);const pulse=Math.sin(t*6)>0;R(10,0,4,3,pulse?P.Y:P.M,s);R(10,0,4,1,'#ffffff55',s);
  // визор
  R(4,8,15,7,P.O,s);R(5,9,13,5,P.V,s);R(5,9,13,1,'#1c2466',s);
  // глаза
  const eye=(x)=>{
    if(e==='open'){R(x,10,3,3,P.E,s);R(x+1,11,2,2,P.Y,s);}
    else if(e==='blink'){R(x,11.5,3,1,P.E,s);}
    else if(e==='wide'){R(x-.5,9.5,4,4,P.E,s);R(x+.5,10.5,2,2,P.V,s);}
    else if(e==='happy'){R(x,11,1,1,P.Y,s);R(x+1,10,1,1,P.Y,s);R(x+2,11,1,1,P.Y,s);}
    else if(e==='look'){R(x,10,3,3,P.E,s);R(x+2,11,1,2,P.Y,s);}
  };eye(7);eye(13);
  R(5,13,2,1,P.M,s);R(16,13,2,1,P.M,s); // щёчки
  // рот (под глазами, внутри визора крошечный)
  if(m==='open'){R(10,13,3,1,P.Y,s);}
  else if(m==='smile'){R(9,13,1,1,P.Y,s);R(10,14,3,0.6,P.Y,s);R(13,13,1,1,P.Y,s);}
  else if(m==='o'){R(11,12.6,1.5,1.5,P.Y,s);}
  else {R(10.5,13.5,2,.6,P.Y,s);}
}
/* ================= «ГЛЮК» ================= */
function slime(s,t,o){ // o:{eyes,mouth}
  const rows=[[4,6],[2,10],[1,12],[0,14],[0,14],[0,14],[0,14],[1,12]];
  rows.forEach(([x,w],j)=>R(x-1,j-1+1,w+2,1,P.O,s));
  R(3,-0,8,1,P.O,s);
  rows.forEach(([x,w],j)=>R(x,j+1,w,1,'#b6ff3b',s));
  R(3,1,8,1,'#d7ff8a',s);R(2,2,3,1,'#e8ffb4',s);R(1,3,2,2,'#e8ffb4',s);
  R(10,4,3,3,'#8cd424',s);R(2,8,10,1,'#8cd424',s);
  R(2,9,3,1,P.O,s);R(9,9,3,1,P.O,s);
  const e=o.eyes||'open',eye=x=>{
    if(e==='open'){R(x,4,2,3,P.V,s);R(x,4,1,1,'#fff',s);}
    else if(e==='wide'){R(x-.5,3.5,3,4,P.V,s);R(x,4,1,1.2,'#fff',s);}
    else if(e==='happy'){R(x,5,1,1,P.V,s);R(x+1,4,1,1,P.V,s);R(x+2,5,1,1,P.V,s);}
  };eye(3.5);eye(8.5);
  R(2,6,2,1,P.M,s);R(10,6,2,1,P.M,s);
  const m=o.mouth||'smile';
  if(m==='o'){R(6,7,2,2,P.V,s);}else if(m==='smile'){R(5.5,7,1,1,P.V,s);R(6.5,7.5,1,.8,P.V,s);R(7.5,7,1,1,P.V,s);}else R(6,7.5,2,.7,P.V,s);
}
function drawChar(fn,x,y,s,w,h,dim,t,o){
  g=og;og.clearRect(0,0,300,300);og.save();og.translate(10,10);fn(s,t,o);
  if(dim){og.globalCompositeOperation='source-atop';og.fillStyle=`rgba(11,10,28,${dim})`;og.fillRect(-10,-10,300,300);}
  og.restore();og.globalCompositeOperation='source-over';g=main;g.drawImage(off,x-10,y-10);
}
/* ================= ФОН ================= */
function bg(t){
  g.fillStyle=C.bg;g.fillRect(0,0,W,H);
  let gr=g.createRadialGradient(W/2,420,10,W/2,420,560);gr.addColorStop(0,'#241b60');gr.addColorStop(.6,'#120e32');gr.addColorStop(1,C.bg);
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  // крупные тонкие круги
  stroke('rgba(140,120,255,.07)',2);[[120,260,180],[440,640,240],[60,760,120]].forEach(([x,y,r],i)=>{g.beginPath();g.arc(x+Math.sin(t*.3+i)*14,y+Math.cos(t*.25+i)*10,r,0,7);g.stroke();});
  // сетка
  g.strokeStyle='rgba(120,100,255,.09)';g.lineWidth=1;const off=(t*10)%36;
  for(let x=0;x<W;x+=36){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();}
  for(let y=-36+off;y<H;y+=36){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}
  // пиксельные искры
  for(let i=0;i<22;i++){const sp=.18+(i%5)*.05,x=(i*97)%W,y=(H-((t*sp*120+i*83)%H));const a=.25+.25*Math.sin(t*2+i);
    g.fillStyle=(i%3?`rgba(61,232,255,${a})`:`rgba(182,255,59,${a})`);const z=(i%2?3:4);g.fillRect(x,y,z,z);}
}
/* ================= ИКОНКИ (линейная графика) ================= */
const ICON={
 clock(t){g.beginPath();g.arc(0,0,98,0,7);g.fillStyle=C.panel;g.fill();stroke(C.ink,7);g.stroke();
  for(let i=0;i<12;i++){const a=i*Math.PI/6;stroke(i%3?C.dim:C.ink,i%3?3:5);g.beginPath();g.moveTo(Math.sin(a)*80,-Math.cos(a)*80);g.lineTo(Math.sin(a)*90,-Math.cos(a)*90);g.stroke();}
  g.save();g.rotate(t*5.2);g.fillStyle='rgba(255,95,168,.18)';g.beginPath();g.moveTo(0,0);g.arc(0,0,76,-Math.PI/2-1.1,-Math.PI/2);g.fill();
  stroke(C.pink,7);g.beginPath();g.moveTo(0,0);g.lineTo(0,-72);g.stroke();g.restore();
  g.save();g.rotate(1.9);stroke(C.ink,9);g.beginPath();g.moveTo(0,0);g.lineTo(0,-46);g.stroke();g.restore();
  g.fillStyle=C.lime;g.beginPath();g.arc(0,0,8,0,7);g.fill();},
 timer(t){const p=clamp(t/1.7);g.beginPath();g.arc(0,6,92,0,7);g.fillStyle=C.panel;g.fill();stroke(C.line,12);g.stroke();
  stroke(C.lime,12);g.beginPath();g.arc(0,6,92,-Math.PI/2,-Math.PI/2+Math.PI*2*ease(p));g.stroke();
  stroke(C.ink,9);g.beginPath();g.moveTo(-18,-100);g.lineTo(18,-100);g.stroke();g.beginPath();g.moveTo(0,-100);g.lineTo(0,-90);g.stroke();
  const sec=Math.round(60*(1-ease(p)));txt(String(Math.floor(sec/60))+':'+String(sec%60).padStart(2,'0'),0,28,60,C.lime,900,'center','DejaVu Sans Mono');
  if(p>=1){const k=back((t-1.7)/.3);g.save();g.translate(70,-70);g.scale(k,k);g.fillStyle=C.lime;g.beginPath();g.arc(0,0,26,0,7);g.fill();stroke(C.bg,7);g.beginPath();g.moveTo(-11,0);g.lineTo(-3,9);g.lineTo(12,-9);g.stroke();g.restore();}},
 film(t){g.save();rr(-110,-60,220,150,14);g.fillStyle=C.panel;g.fill();stroke(C.ink,6);g.stroke();
  g.save();g.translate(0,-60);const k=Math.max(0,1-clamp((t-.3)/.2))*0+Math.sin(Math.min(t*6,6))*0.0;
  g.rotate(-.12*Math.max(0,1-clamp((t-.2)/.25)));rr(-110,-40,220,40,10);g.fillStyle=C.ink;g.fill();
  for(let i=0;i<5;i++){g.fillStyle=C.bg;g.beginPath();g.moveTo(-100+i*44,-40);g.lineTo(-76+i*44,-40);g.lineTo(-92+i*44,0);g.lineTo(-116+i*44,0);g.fill();}g.restore();
  g.fillStyle=C.dim;g.fillRect(-90,-20,180,10);g.fillRect(-90,0,120,10);g.restore();
  // перечёркивание
  const d=ease((t-.5)/.35);stroke(C.pink,12);g.beginPath();g.moveTo(-122,-82);g.lineTo(-122+244*d,-82+190*d);g.stroke();},
 bulb(t){const gl=.5+.3*Math.sin(t*7);
  const gr=g.createRadialGradient(0,-24,10,0,-24,140);gr.addColorStop(0,`rgba(182,255,59,${gl*.5})`);gr.addColorStop(1,'rgba(182,255,59,0)');g.fillStyle=gr;g.fillRect(-150,-170,300,300);
  stroke(C.ink,7);g.beginPath();g.arc(0,-24,64,Math.PI*.78,Math.PI*2.22);g.lineTo(22,48);g.lineTo(-22,48);g.closePath();g.fillStyle=C.panel;g.fill();g.stroke();
  stroke(C.lime,6);g.beginPath();g.moveTo(-20,-6);g.lineTo(-8,-34);g.lineTo(8,-6);g.lineTo(20,-34);g.stroke();g.beginPath();g.moveTo(-8,-6);g.lineTo(-8,40);g.moveTo(8,-6);g.lineTo(8,40);g.stroke();
  stroke(C.ink,7);[0,1,2].forEach(i=>{g.beginPath();g.moveTo(-22+i*3,56+i*13);g.lineTo(22-i*3,56+i*13);g.stroke();});
  stroke(C.lime,6);for(let a=0;a<7;a++){const an=-Math.PI+a*Math.PI/6,l=20+8*Math.sin(t*8+a);g.beginPath();g.moveTo(Math.cos(an)*88,-24+Math.sin(an)*88);g.lineTo(Math.cos(an)*(88+l),-24+Math.sin(an)*(88+l));g.stroke();}},
 doc(t){g.beginPath();g.moveTo(-76,-100);g.lineTo(34,-100);g.lineTo(76,-58);g.lineTo(76,100);g.lineTo(-76,100);g.closePath();g.fillStyle=C.panel;g.fill();stroke(C.ink,6);g.stroke();
  g.beginPath();g.moveTo(34,-100);g.lineTo(34,-58);g.lineTo(76,-58);g.stroke();
  const L=[[-52,-58,70,C.lime],[-52,-26,104,C.dim],[-52,2,92,C.dim],[-52,30,104,C.dim],[-52,58,60,C.dim]];
  const n=t*4.2;L.forEach(([x,y,w,c],i)=>{const k=clamp(n-i);g.fillStyle=c;rr(x,y,w*k,12,6);g.fill();});
  if(Math.sin(t*10)>0){const i=Math.min(Math.floor(n),4),k=clamp(n-i);g.fillStyle=C.cyan;g.fillRect(-52+L[i][2]*k+4,L[i][1]-4,4,20);}},
 wave(t){rr(-120,-70,240,140,22);g.fillStyle=C.panel;g.fill();stroke(C.ink,6);g.stroke();
  for(let i=-9;i<=9;i++){const h=14+Math.abs(Math.sin(t*6+i*.62))*64*Math.cos(i*.12);g.fillStyle=i<(t*7-9)?C.lime:C.cyan;rr(i*11-4,-h/2,8,h,4);g.fill();}
  g.fillStyle=C.pink;g.beginPath();g.arc(0,100,0,0,7);g.fill();txt("🎙",0,0,0,'#0000',400);},
 timeline(t){rr(-125,-85,250,170,14);g.fillStyle=C.panel;g.fill();stroke(C.ink,5);g.stroke();
  [C.pink,C.lime,C.cyan].forEach((c,i)=>{g.fillStyle=c;g.beginPath();g.arc(-107+i*14,-68,4,0,7);g.fill();});
  g.strokeStyle=C.line;g.lineWidth=2;for(let i=0;i<12;i++){g.beginPath();g.moveTo(-108+i*19,-50);g.lineTo(-108+i*19,i%3?-44:-38);g.stroke();}
  const grow=ease(t*2);[[-108,-26,100,C.cyan],[-2,-26,100,C.pink],[-108,10,60,C.lime],[-44,10,140,C.cyan],[-108,46,210,C.dim]].forEach(([x,y,w,c])=>{g.fillStyle=c;rr(x,y,w*grow,26,6);g.fill();});
  const px=-108+((t*60)%216);g.fillStyle=C.ink;g.fillRect(px-1.5,-52,3,128);g.beginPath();g.moveTo(px-7,-54);g.lineTo(px+7,-54);g.lineTo(px,-44);g.fill();},
 coin(t){const s=Math.abs(Math.cos(t*2.6)),y=-62;g.save();g.translate(0,y);g.scale(s*.92+.08,1);g.beginPath();g.arc(0,0,72,0,7);g.fillStyle='#ffd23b';g.fill();stroke('#c69500',7);g.stroke();
  g.beginPath();g.arc(0,0,54,0,7);stroke('#c69500',3);g.stroke();txt("₽",0,22,70,'#8a6500',900);g.restore();
  g.save();g.translate(0,84);g.rotate(-.08);rr(-110,-30,220,60,12);g.fillStyle='rgba(61,255,150,.10)';g.fill();stroke('#3dff96',4);g.stroke();
  txt("БЕСПЛАТНО",0,10,30,'#3dff96',900);g.restore();},
 arrow(t){const b=Math.sin(t*5)*10;g.save();g.translate(0,b);
  stroke(C.dim,4);g.setLineDash([8,10]);g.beginPath();g.moveTo(-140,90);g.bezierCurveTo(-100,20,-60,70,-30,10);g.stroke();g.setLineDash([]);
  g.rotate(-.35);g.fillStyle=C.cyan;g.beginPath();g.moveTo(-70,-12);g.lineTo(100,-48);g.lineTo(50,70);g.lineTo(18,18);g.closePath();g.fill();
  g.fillStyle='#bdf6ff';g.beginPath();g.moveTo(18,18);g.lineTo(100,-48);g.lineTo(-70,-12);g.closePath();g.fill();
  stroke('#0b4d66',4);g.beginPath();g.moveTo(18,18);g.lineTo(100,-48);g.stroke();g.restore();
  rr(-80,76,160,42,21);g.fillStyle=C.panel;g.fill();stroke(C.lime,3);g.stroke();txt("PDF-гайд",0,105,22,C.lime,800,'center',FONT2);}
};
/* ================= ТЕКСТ ================= */
function kinetic(str,y,size,col,lt,font=FONT,w=800){
  const ws=str.split(' ');g.font=`${w} ${size}px ${font}`;const sp=g.measureText(' ').width;
  const wd=ws.map(x=>g.measureText(x).width),tot=wd.reduce((a,b)=>a+b,0)+sp*(ws.length-1);let x=W/2-tot/2;
  ws.forEach((x0,i)=>{const k=back((lt-i*.07)/.28),a=clamp((lt-i*.07)/.12);g.globalAlpha=a;g.save();g.translate(x+wd[i]/2,y);g.scale(.6+.4*k,.6+.4*k);txt(x0,0,14*0,size,col,w,'center',font);g.restore();x+=wd[i]+sp;});g.globalAlpha=1;
}
function bigWord(str,y,lt){
  const bs=fit(str,430,92,900);g.font=`900 ${bs}px ${FONT}`;const tw=g.measureText(str).width;
  const k=back(lt/.32),a=clamp(lt/.1);g.globalAlpha=a;g.save();g.translate(W/2,y);g.scale(.5+.5*k,.5+.5*k);
  txt(str,3,5,bs,'rgba(0,0,0,.55)',900);txt(str,0,0,bs,C.lime,900);
  // выделяющая рамка с узлами
  const bw=tw+34,bh=bs*1.05,x0=-bw/2,y0=-bs*.82,pr=ease((lt-.05)/.3);
  stroke(C.lime,3);g.setLineDash([bw*2*pr,1e4]);g.strokeRect(x0,y0,bw,bh);g.setLineDash([]);
  g.fillStyle=C.lime;[[x0,y0],[x0+bw,y0],[x0,y0+bh],[x0+bw,y0+bh]].forEach(([x,y])=>{g.fillRect(x-4,y-4,8,8);});
  g.restore();g.globalAlpha=1;
}
function bubble(txtS,x,y,k){ // пиксельный пузырь реакции
  g.save();g.translate(x,y);g.scale(k,k);const s=fit(txtS,150,28,800,FONT2);g.font=`800 ${s}px ${FONT2}`;const w=g.measureText(txtS).width+30;
  rr(-w/2,-52,w,42,10);g.fillStyle=C.ink;g.fill();g.beginPath();g.moveTo(-8,-12);g.lineTo(0,2);g.lineTo(10,-12);g.fill();
  txt(txtS,0,-22,s,C.bg,800,'center',FONT2);g.restore();

/* ================= КАДР ================= */
function sceneDurs(){const c=window.CONFIG,T=window.TIMING;return c.scenes.map((_,k)=>T&&T[k]?T[k]:c.sceneSec);}
window.TOTAL=()=>sceneDurs().reduce((a,b)=>a+b,0);
function render(t){
  const cfg=window.CONFIG,N=cfg.scenes.length,total=window.TOTAL(),dur=sceneDurs();
  let i=0,st=0;while(i<N-1&&t>=st+dur[i]){st+=dur[i];i++;}
  const D=dur[i],lt=t-st,sc=cfg.scenes[i];
  g=main;g.save();bg(t);
  // лёгкий наезд камеры
  const z=1+.03*(lt/D);g.translate(W/2,H/2);g.scale(z,z);g.translate(-W/2,-H/2);
  // прощание/появление контента
  const out=clamp((lt-(D-.14))/.14),inn=ease(lt/.22),A=inn*(1-out*.9);
  g.globalAlpha=A;g.save();g.translate(0,(1-inn)*36);
