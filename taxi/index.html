<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Ճամփա տաքսի</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#ffffff;--fg:#111;--muted:#6b6b6b;--line:#e8e8e8;--card:#f4f4f4;
  --accent:#ffd400;--accent-fg:#111;--ok:#1a9e55;--shadow:0 -6px 24px rgba(0,0,0,.12);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17181a;--fg:#f2f2f2;--muted:#9a9a9a;--line:#2b2d30;--card:#222427;--shadow:0 -6px 24px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{--bg:#17181a;--fg:#f2f2f2;--muted:#9a9a9a;--line:#2b2d30;--card:#222427;--shadow:0 -6px 24px rgba(0,0,0,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#map{position:fixed;inset:0;z-index:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{position:fixed;top:calc(12px + env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;z-index:500;pointer-events:none}
.round{pointer-events:auto;width:44px;height:44px;border-radius:50%;background:var(--bg);box-shadow:0 2px 10px rgba(0,0,0,.18);display:grid;place-items:center;font-size:20px}
.brand{pointer-events:auto;background:var(--bg);border-radius:22px;padding:0 16px;height:44px;display:flex;align-items:center;gap:8px;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--accent);display:inline-block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:600;background:var(--bg);border-radius:20px 20px 0 0;box-shadow:var(--shadow);padding:10px 16px calc(16px + env(safe-area-inset-bottom));max-height:78vh;overflow:auto;max-width:560px;margin:0 auto}
.grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.field{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:12px;margin-bottom:8px;width:100%;text-align:left}
.field .dot{width:10px;height:10px;border-radius:50%;flex:none}
.field .txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.field .ph{color:var(--muted)}
.field.active{outline:2px solid var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chip{flex:none;background:var(--card);border-radius:18px;padding:8px 12px;font-size:13px}
.tariffs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.tariff{flex:none;width:104px;border-radius:14px;background:var(--card);padding:10px;text-align:left;border:2px solid transparent}
.tariff.sel{border-color:var(--accent);background:var(--bg)}
.tariff .ic{font-size:26px}
.tariff b{display:block;margin-top:4px}
.tariff small{color:var(--muted)}
.cta{width:100%;background:var(--accent);color:var(--accent-fg);font-weight:700;border-radius:14px;padding:16px;font-size:16px}
.cta:disabled{opacity:.45}
.ghost{width:100%;background:var(--card);border-radius:14px;padding:14px;margin-top:8px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.pay{display:flex;gap:8px;margin-bottom:10px}
.pay button{flex:1;background:var(--card);border-radius:12px;padding:10px;font-size:13px;border:2px solid transparent}
.pay button.sel{border-color:var(--accent)}
h2{margin:4px 0 6px;font-size:20px}
.driver{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:12px;margin:10px 0}
.ava{width:52px;height:52px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:24px;flex:none}
.plate{display:inline-block;border:2px solid var(--fg);border-radius:6px;padding:1px 6px;font-weight:700;letter-spacing:1px;font-size:13px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:10px 0}
.bar div{height:100%;width:30%;background:var(--accent);animation:ld 1.2s infinite ease-in-out}
@keyframes ld{0%{margin-left:-30%}100%{margin-left:100%}}
.stars{display:flex;justify-content:center;gap:6px;font-size:36px;margin:10px 0}
.stars button{color:var(--line)}.stars button.on{color:var(--accent)}
.drawer{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.4);display:none}
.drawer.open{display:block}
.drawer .panel{position:absolute;top:0;bottom:0;left:0;width:min(320px,86vw);background:var(--bg);padding:calc(20px + env(safe-area-inset-top)) 16px 16px;overflow:auto}
.hist{border-bottom:1px solid var(--line);padding:10px 0;font-size:14px}
.search{position:fixed;inset:0;z-index:800;background:var(--bg);display:none;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 16px 16px}
.search.open{display:flex}
.search input{width:100%;font:inherit;font-size:16px;padding:14px;border-radius:12px;border:0;background:var(--card);color:var(--fg);outline:none}
.res{padding:12px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.res small{display:block;color:var(--muted)}
.pin{position:fixed;left:50%;top:calc(50% - 22vh);transform:translate(-50%,-100%);z-index:400;font-size:38px;pointer-events:none;display:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.pin.on{display:block}
.toast{position:fixed;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:20px;z-index:1000;font-size:14px;display:none;max-width:calc(100% - 32px)}
.car-ic{font-size:26px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.mk{width:18px;height:18px;border-radius:50%;border:4px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.leaflet-control-attribution{font-size:9px}
</style>
</head>
<body>
<div id="map"></div>
<div class="pin" id="pin">📍</div>

<div class="top">
  <button class="round" id="menuBtn" aria-label="Մենյու">☰</button>
  <div class="brand"><i></i>Ճամփա</div>
  <button class="round" id="locBtn" aria-label="Իմ տեղը">◎</button>
</div>

<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<div class="search" id="search">
  <div class="row" style="margin-bottom:10px">
    <button class="round" id="searchClose" style="box-shadow:none;background:var(--card)">←</button>
    <div style="flex:1;margin-left:10px"><input id="q" placeholder="Որտե՞ղ" autocomplete="off"></div>
  </div>
  <button class="res" id="pickOnMap">🗺️ <b>Ընտրել քարտեզի վրա</b></button>
  <div id="results" style="overflow:auto"></div>
</div>

<div class="drawer" id="drawer"><div class="panel">
  <h2>Ճամփա</h2>
  <p class="muted" style="margin-top:0">Տաքսի Երևանում</p>
  <h3>Իմ ուղևորությունները</h3>
  <div id="history"></div>
  <button class="ghost" id="themeBtn">🌓 Փոխել թեման</button>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---------- կարգավորումներ ----------
const TARIFFS = [
  {id:'eco',  name:'Էկոնոմ',  ic:'🚗', base:600,  km:120, min:15, eta:3},
  {id:'comf', name:'Կոմֆորտ', ic:'🚙', base:800,  km:160, min:20, eta:5},
  {id:'biz',  name:'Բիզնես',  ic:'🚘', base:1500, km:300, min:35, eta:8},
  {id:'mini', name:'Մինիվեն', ic:'🚐', base:1200, km:220, min:25, eta:9},
  {id:'del',  name:'Առաքում', ic:'📦', base:700,  km:130, min:10, eta:6},
];
const PLACES = [
  {name:'Հանրապետության հրապարակ', sub:'Կենտրոն', ll:[40.1777,44.5126]},
  {name:'Կասկադ', sub:'Կենտրոն', ll:[40.1912,44.5152]},
  {name:'Զվարթնոց օդանավակայան', sub:'EVN', ll:[40.1473,44.3959]},
  {name:'Հյուսիսային պողոտա', sub:'Կենտրոն', ll:[40.1830,44.5145]},
  {name:'Օպերա', sub:'Կենտրոն', ll:[40.1863,44.5152]},
  {name:'Դալմա Գարդեն Մոլ', sub:'Ծիծեռնակաբերդի խճ.', ll:[40.1754,44.4851]},
  {name:'Երևան Մոլ', sub:'Արշակունյաց պող.', ll:[40.1592,44.4911]},
  {name:'Սասունցի Դավիթ կայարան', sub:'Էրեբունի', ll:[40.1557,44.5130]},
  {name:'Մայր Հայաստան', sub:'Հաղթանակի այգի', ll:[40.1960,44.5257]},
  {name:'Վերնիսաժ', sub:'Կենտրոն', ll:[40.1757,44.5171]},
  {name:'Կոմիտասի պողոտա', sub:'Արաբկիր', ll:[40.2050,44.5040]},
  {name:'Մալաթիա', sub:'Մալաթիա-Սեբաստիա', ll:[40.1720,44.4520]},
];
const DRIVERS = [
  {n:'Արմեն', car:'Toyota Camry', color:'սպիտակ', r:4.9},
  {n:'Դավիթ', car:'Kia Optima', color:'սև', r:4.8},
  {n:'Գոռ', car:'Hyundai Sonata', color:'մոխրագույն', r:4.95},
  {n:'Տիգրան', car:'Mercedes E', color:'սև', r:4.97},
  {n:'Վահե', car:'Opel Zafira', color:'կապույտ', r:4.85},
];
const YEREVAN = [40.1792,44.4991];

// ---------- վիճակ ----------
const S = {from:null, to:null, tariff:'eco', pay:'cash', route:null, step:'home', editing:null, driver:null, rating:0};
const store = {
  get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
try{const t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}

// ---------- քարտեզ ----------
const map = L.map('map',{zoomControl:false,attributionControl:true}).setView(YEREVAN,13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const dotIcon = c => L.divIcon({className:'',html:`<div class="mk" style="background:${c}"></div>`,iconSize:[18,18],iconAnchor:[9,9]});
const carIcon = L.divIcon({className:'',html:'<div class="car-ic">🚕</div>',iconSize:[28,28],iconAnchor:[14,14]});
let mFrom=null, mTo=null, routeLine=null, carMarker=null, idleCars=[];

function spawnIdleCars(){
  idleCars.forEach(c=>map.removeLayer(c)); idleCars=[];
  const c = S.from?.ll || map.getCenter();
  const lat = c.lat ?? c[0], lng = c.lng ?? c[1];
  for(let i=0;i<7;i++){
    const m = L.marker([lat+(Math.random()-.5)*.025, lng+(Math.random()-.5)*.035],{icon:carIcon,interactive:false}).addTo(map);
    idleCars.push(m);
  }
}
setInterval(()=>{ if(S.step!=='home'&&S.step!=='order') return;
  idleCars.forEach(m=>{const p=m.getLatLng();m.setLatLng([p.lat+(Math.random()-.5)*.0008,p.lng+(Math.random()-.5)*.0008])});
},1500);

// ---------- օգնականներ ----------
const $ = id => document.getElementById(id);
const amd = n => (Math.round(n/50)*50).toLocaleString('ru-RU')+' ֏';
function toast(t,ms=2200){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',ms)}
function haversine(a,b){const R=6371,r=x=>x*Math.PI/180;const dLa=r(b[0]-a[0]),dLo=r(b[1]-a[1]);
  const h=Math.sin(dLa/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function price(t){ if(!S.route) return null; const tr=TARIFFS.find(x=>x.id===t);
  const surge = (new Date().getHours()>=18&&new Date().getHours()<=20)?1.2:1;
  return Math.max(tr.base+400, (tr.base + tr.km*S.route.km + tr.min*S.route.min)*surge); }

async function reverse(ll){
  try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${ll[0]}&lon=${ll[1]}&accept-language=hy&zoom=18`);
    const j=await r.json(); const a=j.address||{};
    const name=[a.road,a.house_number].filter(Boolean).join(' ')||j.name||j.display_name?.split(',')[0];
    return name||'Նշված կետ';
  }catch(e){return `Կետ ${ll[0].toFixed(4)}, ${ll[1].toFixed(4)}`}
}
async function geocode(q){
  try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&accept-language=hy&limit=6&viewbox=44.35,40.25,44.65,40.10&bounded=1`);
    return (await r.json()).map(x=>({name:x.display_name.split(',')[0],sub:x.display_name.split(',').slice(1,3).join(','),ll:[+x.lat,+x.lon]}));
  }catch(e){return []}
}
async function buildRoute(){
  if(!S.from||!S.to){S.route=null;return}
  const a=S.from.ll,b=S.to.ll;
  try{
    const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson`);
    const j=await r.json(); const rt=j.routes[0];
    S.route={km:rt.distance/1000,min:rt.duration/60*1.3,pts:rt.geometry.coordinates.map(c=>[c[1],c[0]])};
  }catch(e){
    const km=haversine(a,b)*1.35; S.route={km,min:km/25*60,pts:[a,b]};
  }
  drawRoute();
}
function drawRoute(){
  if(routeLine) map.removeLayer(routeLine);
  if(!S.route) return;
  routeLine=L.polyline(S.route.pts,{color:'#111',weight:5,opacity:.85}).addTo(map);
  map.fitBounds(routeLine.getBounds(),{paddingTopLeft:[40,90],paddingBottomRight:[40,window.innerHeight*.5]});
}
function setPoint(kind,p){
  S[kind]=p;
  const color=kind==='from'?'#1a9e55':'#e53935';
  if(kind==='from'){ if(mFrom) map.removeLayer(mFrom); mFrom=L.marker(p.ll,{icon:dotIcon(color)}).addTo(map); }
  else { if(mTo) map.removeLayer(mTo); mTo=L.marker(p.ll,{icon:dotIcon(color)}).addTo(map); }
  if(S.from&&S.to){ S.step='order'; buildRoute().then(render); } else { map.setView(p.ll,15); render(); }
  if(kind==='from') spawnIdleCars();
}

// ---------- էկրաններ ----------
function render(){
  const sh=$('sheet');
  const fromTxt = S.from?`<span class="txt">${S.from.name}</span>`:`<span class="txt ph">Որտեղի՞ց</span>`;
  const toTxt = S.to?`<span class="txt">${S.to.name}</span>`:`<span class="txt ph">Որտե՞ղ</span>`;
  if(S.step==='home'||S.step==='order'){
    const fav=PLACES.slice(0,6).map((p,i)=>`<button class="chip" data-fav="${i}">${p.name}</button>`).join('');
    let html=`<div class="grip"></div>
      <button class="field" data-edit="from"><span class="dot" style="background:#1a9e55"></span>${fromTxt}</button>
      <button class="field" data-edit="to"><span class="dot" style="background:#e53935"></span>${toTxt}</button>`;
    if(!S.to) html+=`<div class="chips">${fav}</div>`;
    if(S.route){
      html+=`<div class="row muted" style="font-size:13px;margin:2px 0 6px"><span>${S.route.km.toFixed(1)} կմ · ~${Math.round(S.route.min)} րոպե</span>
        <button class="muted" id="swap">⇅ Փոխել տեղերը</button></div>`;
    }
    html+=`<div class="tariffs">${TARIFFS.map(t=>{const p=price(t.id);
      return `<button class="tariff ${S.tariff===t.id?'sel':''}" data-t="${t.id}"><div class="ic">${t.ic}</div><b>${t.name}</b><small>${p?amd(p):t.eta+' րոպե'}</small></button>`}).join('')}</div>
      <div class="pay">
        <button data-pay="cash" class="${S.pay==='cash'?'sel':''}">💵 Կանխիկ</button>
        <button data-pay="card" class="${S.pay==='card'?'sel':''}">💳 Քարտ</button>
        <button data-pay="idram" class="${S.pay==='idram'?'sel':''}">📱 Idram</button>
      </div>
      <button class="cta" id="orderBtn" ${S.from&&S.to?'':'disabled'}>${S.from&&S.to?'Պատվիրել · '+amd(price(S.tariff)):'Ընտրեք հասցեն'}</button>`;
    sh.innerHTML=html;
  }
  else if(S.step==='searching'){
    sh.innerHTML=`<div class="grip"></div><h2>Վարորդ ենք փնտրում…</h2>
      <p class="muted" style="margin:0">${TARIFFS.find(t=>t.id===S.tariff).name} · ${amd(price(S.tariff))}</p>
      <div class="bar"><div></div></div>
      <button class="ghost" id="cancelBtn">Չեղարկել</button>`;
  }
  else if(S.step==='coming'||S.step==='arrived'||S.step==='riding'){
    const d=S.driver;
    const title={coming:`Վարորդը կգա ${S.eta} րոպեից`,arrived:'Վարորդը սպասում է Ձեզ',riding:`Ճանապարհին · ${S.eta} րոպե`}[S.step];
    sh.innerHTML=`<div class="grip"></div><h2>${title}</h2>
      <p class="muted" style="margin:0">${S.step==='riding'?S.to.name:S.from.name}</p>
      <div class="driver"><div class="ava">👤</div><div style="flex:1">
        <b>${d.n}</b> · ⭐ ${d.r}<br><span class="muted">${d.car}, ${d.color}</span><br><span class="plate">${d.plate}</span>
      </div></div>
      <div class="row" style="gap:8px">
        <button class="ghost" style="margin:0" onclick="toast('Զանգ վարորդին (դեմո)')">📞 Զանգ</button>
        <button class="ghost" style="margin:0" onclick="toast('Չատ (դեմո)')">💬 Գրել</button>
      </div>
      ${S.step!=='riding'?'<button class="ghost" id="cancelBtn">Չեղարկել պատվերը</button>':''}
      <p class="muted" style="font-size:13px;text-align:center;margin-bottom:0">${amd(S.final)} · ${{cash:'Կանխիկ',card:'Քարտ',idram:'Idram'}[S.pay]}</p>`;
  }
  else if(S.step==='done'){
    sh.innerHTML=`<div class="grip"></div><h2 style="text-align:center">Հասանք 🎉</h2>
      <p style="text-align:center;font-size:28px;font-weight:700;margin:6px 0">${amd(S.final)}</p>
      <p class="muted" style="text-align:center;margin:0">Գնահատեք ${S.driver.n}-ին</p>
      <div class="stars">${[1,2,3,4,5].map(i=>`<button data-star="${i}" class="${S.rating>=i?'on':''}">★</button>`).join('')}</div>
      <button class="cta" id="doneBtn">Պատրաստ է</button>`;
  }
}

// ---------- պատվերի սիմուլյացիա ----------
let timers=[];
function clearTimers(){timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[]}
function animateAlong(pts,seconds,onTick,onDone){
  if(carMarker) map.removeLayer(carMarker);
  carMarker=L.marker(pts[0],{icon:carIcon}).addTo(map);
  const steps=Math.max(1,seconds*10); let i=0;
  // հավասար բաշխում ըստ երկարության
  const seg=[0];for(let k=1;k<pts.length;k++)seg.push(seg[k-1]+haversine(pts[k-1],pts[k]));
  const total=seg[seg.length-1]||1;
  const iv=setInterval(()=>{
    i++; const d=total*i/steps; let k=1; while(k<seg.length-1&&seg[k]<d)k++;
    const f=(d-seg[k-1])/((seg[k]-seg[k-1])||1); const a=pts[k-1],b=pts[k]||a;
    carMarker.setLatLng([a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]);
    onTick&&onTick(1-i/steps);
    if(i>=steps){clearInterval(iv);onDone&&onDone()}
  },100); timers.push(iv);
}
function startOrder(){
  S.step='searching'; S.final=price(S.tariff); render();
  idleCars.forEach(c=>map.removeLayer(c)); idleCars=[];
  timers.push(setTimeout(()=>{
    const d={...DRIVERS[Math.floor(Math.random()*DRIVERS.length)]};
    d.plate=`${10+Math.floor(Math.random()*89)} ${'ABCEKMOT'[Math.floor(Math.random()*8)]}${'ABCEKMOT'[Math.floor(Math.random()*8)]} ${100+Math.floor(Math.random()*899)}`;
    S.driver=d; S.step='coming';
    const tr=TARIFFS.find(t=>t.id===S.tariff); S.eta=tr.eta; render();
    const a=S.from.ll, start=[a[0]+.006,a[1]-.008];
    animateAlong([start,[a[0]+.006,a[1]],a],12,left=>{const e=Math.max(1,Math.ceil(left*tr.eta));if(e!==S.eta){S.eta=e;render()}},()=>{
      S.step='arrived'; render(); toast('🚕 Վարորդը տեղում է');
      timers.push(setTimeout(()=>{
        S.step='riding'; S.eta=Math.round(S.route.min); render();
        animateAlong(S.route.pts,20,left=>{const e=Math.max(1,Math.ceil(left*S.route.min));if(e!==S.eta){S.eta=e;render()}},()=>{
          S.step='done'; render();
        });
      },4000));
    });
  },3500));
}
function resetAll(keepFrom=true){
  clearTimers();
  if(carMarker){map.removeLayer(carMarker);carMarker=null}
  if(routeLine){map.removeLayer(routeLine);routeLine=null}
  if(mTo){map.removeLayer(mTo);mTo=null}
  S.to=null;S.route=null;S.driver=null;S.rating=0;S.step='home';
  if(!keepFrom){S.from=null;if(mFrom){map.removeLayer(mFrom);mFrom=null}}
  spawnIdleCars(); render();
}

// ---------- որոնում ----------
function openSearch(kind){
  S.editing=kind; $('q').value=''; $('q').placeholder=kind==='from'?'Որտեղի՞ց':'Որտե՞ղ';
  showResults(PLACES); $('search').classList.add('open'); setTimeout(()=>$('q').focus(),50);
}
function showResults(list){
  const recent=store.get('recent',[]);
  const all = $('q').value? list : [...recent.map(r=>({...r,sub:'🕘 '+(r.sub||'')})),...list.filter(p=>!recent.some(r=>r.name===p.name))];
  $('results').innerHTML=all.map((p,i)=>`<button class="res" data-r="${i}"><b>${p.name}</b><small>${p.sub||''}</small></button>`).join('')||'<p class="muted">Ոչինչ չի գտնվել</p>';
  $('results')._list=all;
}
let qT;
$('q').addEventListener('input',e=>{
  const v=e.target.value.trim().toLowerCase();
  const local=PLACES.filter(p=>p.name.toLowerCase().includes(v));
  showResults(local);
  clearTimeout(qT); if(v.length<3) return;
  qT=setTimeout(async()=>{const g=await geocode(v); if($('q').value.trim().toLowerCase()===v) showResults([...local,...g])},450);
});
$('results').addEventListener('click',e=>{
  const b=e.target.closest('[data-r]'); if(!b) return;
  const p=$('results')._list[+b.dataset.r];
  const rec=store.get('recent',[]).filter(r=>r.name!==p.name); rec.unshift({name:p.name,sub:p.sub?.replace('🕘 ',''),ll:p.ll}); store.set('recent',rec.slice(0,4));
  $('search').classList.remove('open'); setPoint(S.editing,{name:p.name,ll:p.ll});
});
$('searchClose').onclick=()=>$('search').classList.remove('open');

// քարտեզի վրա ընտրել
let picking=null;
$('pickOnMap').onclick=()=>{
  picking=S.editing; $('search').classList.remove('open'); $('pin').classList.add('on');
  $('sheet').innerHTML=`<div class="grip"></div><h2>${picking==='from'?'Նստելու վայրը':'Նպատակակետը'}</h2>
    <p class="muted" id="pickName" style="margin:0 0 12px">Տեղաշարժեք քարտեզը</p>
    <button class="cta" id="pickOk">Հաստատել</button><button class="ghost" id="pickCancel">Չեղարկել</button>`;
  updatePick();
};
function pinLatLng(){const p=$('pin').getBoundingClientRect();return map.containerPointToLatLng([p.left+p.width/2,p.bottom])}
let pickT; async function updatePick(){clearTimeout(pickT);pickT=setTimeout(async()=>{const ll=pinLatLng();const n=await reverse([ll.lat,ll.lng]);if(picking&&$('pickName'))$('pickName').textContent=n},350)}
map.on('moveend',()=>{if(picking)updatePick()});

// ---------- իրադարձություններ ----------
document.addEventListener('click',async e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.edit) openSearch(t.dataset.edit);
  else if(t.dataset.fav){const p=PLACES[+t.dataset.fav]; setPoint('to',{name:p.name,ll:p.ll}); if(!S.from) toast('Նշեք նստելու վայրը')}
  else if(t.dataset.t){S.tariff=t.dataset.t;render()}
  else if(t.dataset.pay){S.pay=t.dataset.pay;render()}
  else if(t.dataset.star){S.rating=+t.dataset.star;render()}
  else if(t.id==='swap'){const f=S.from;setPoint('from',S.to);setPoint('to',f)}
  else if(t.id==='orderBtn') startOrder();
  else if(t.id==='cancelBtn'){resetAll();toast('Պատվերը չեղարկվեց')}
  else if(t.id==='doneBtn'){
    const h=store.get('history',[]);h.unshift({from:S.from.name,to:S.to.name,price:S.final,t:S.tariff,d:new Date().toISOString(),driver:S.driver.n,rating:S.rating});
    store.set('history',h.slice(0,30)); toast('Շնորհակալություն 💛'); resetAll();
  }
  else if(t.id==='pickOk'){
    const ll=pinLatLng(); const name=$('pickName').textContent; const k=picking; picking=null; $('pin').classList.remove('on');
    setPoint(k,{name:name==='Տեղաշարժեք քարտեզը'?await reverse([ll.lat,ll.lng]):name,ll:[ll.lat,ll.lng]});
  }
  else if(t.id==='pickCancel'){picking=null;$('pin').classList.remove('on');render()}
});
$('menuBtn').onclick=()=>{
  const h=store.get('history',[]);
  $('history').innerHTML=h.length?h.map(x=>`<div class="hist"><b>${x.from} → ${x.to}</b><br>
    <span class="muted">${new Date(x.d).toLocaleString('hy-AM',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})} · ${amd(x.price)} · ${x.driver}${x.rating?' · '+'★'.repeat(x.rating):''}</span></div>`).join(''):'<p class="muted">Դեռ ուղևորություններ չկան</p>';
  $('drawer').classList.add('open');
};
$('drawer').onclick=e=>{if(e.target.id==='drawer')$('drawer').classList.remove('open')};
$('themeBtn').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('theme',r.dataset.theme)}catch(e){}};

function locate(){
  if(!navigator.geolocation){useDefault();return}
  navigator.geolocation.getCurrentPosition(async p=>{
    const ll=[p.coords.latitude,p.coords.longitude];
    if(haversine(ll,YEREVAN)>40){useDefault();toast('Դուք Երևանից դուրս եք. ցուցադրում ենք կենտրոնը');return}
    setPoint('from',{name:await reverse(ll),ll});
  },useDefault,{timeout:6000});
}
function useDefault(){ if(!S.from) setPoint('from',{name:PLACES[0].name,ll:PLACES[0].ll}); }
$('locBtn').onclick=locate;

render(); spawnIdleCars(); locate();
</script>
