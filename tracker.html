<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Եկամտի հաշվիչ</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#f7f7f5; --card:#fff; --text:#1d1d1f; --muted:#5f6368; --accent:#e8590c;
          --ok:#2b8a3e; --border:#e3e3e0; --bar:#ececea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141416; --card:#1e1e22; --text:#f1f1f3; --muted:#a0a0a8; --accent:#ff7a2e;
            --ok:#51cf66; --border:#2e2e34; --bar:#2a2a30; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:24px 16px 48px; }
  h1 { margin:0 0 4px; font-size:1.6rem; }
  .muted { color:var(--muted); }
  .stats { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); margin:20px 0; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px; }
  .label { color:var(--muted); font-size:.85rem; }
  .value { font-size:1.4rem; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums; }
  .bar { height:12px; background:var(--bar); border-radius:6px; overflow:hidden; margin-top:8px; }
  .bar > div { height:100%; background:var(--accent); width:0; transition:width .4s; }
  form { display:grid; gap:8px; grid-template-columns:1fr 1fr; }
  form .full { grid-column:1 / -1; }
  input, button { font:inherit; padding:10px; border-radius:8px; border:1px solid var(--border);
                  background:var(--card); color:var(--text); width:100%; }
  button { background:var(--accent); color:#fff; border:0; font-weight:600; cursor:pointer; }
  table { width:100%; border-collapse:collapse; margin-top:12px; font-size:.95rem; }
  td, th { padding:8px 4px; border-bottom:1px solid var(--border); text-align:left; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .del { background:none; color:var(--muted); width:auto; padding:2px 6px; }
  .ok { color:var(--ok); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Եկամտի հաշվիչ՝ 1 ֏ / վայրկյան</h1>
  <p class="muted">Նպատակ՝ աշխատած ամեն ժամի համար 3 600 ֏, ամսական՝ 633 600 ֏ (22 աշխատանքային օր × 8 ժամ)։ Տվյալները պահվում են միայն այս բրաուզերում։</p>

  <div class="stats">
    <div class="card"><div class="label">Ընդհանուր վաստակ</div><div class="value" id="total">0 ֏</div></div>
    <div class="card"><div class="label">Աշխատած ժամեր</div><div class="value" id="hours">0</div></div>
    <div class="card"><div class="label">Իրական արագություն</div><div class="value" id="rate">0 ֏/վրկ</div></div>
  </div>

  <div class="card">
    <div class="label">Այս ամիս՝ <b id="month">0 ֏</b> / 633 600 ֏</div>
    <div class="bar"><div id="monthbar"></div></div>
    <div class="label" id="verdict" style="margin-top:8px"></div>
  </div>

  <h2 style="font-size:1.15rem;margin-top:28px">Ավելացնել եկամուտ</h2>
  <form id="f">
    <input type="date" id="d" required>
    <input type="number" id="a" min="1" step="1" placeholder="Գումար (֏)" required>
    <input type="number" id="h" min="0.1" step="0.1" placeholder="Ծախսված ժամեր" required>
    <input type="text" id="n" placeholder="Նշում (օր.՝ սրճարանի կայք)">
    <button class="full" type="submit">Ավելացնել</button>
  </form>

  <table><thead><tr><th>Ամսաթիվ</th><th>Նշում</th><th style="text-align:right">֏</th><th style="text-align:right">ժ</th><th></th></tr></thead>
    <tbody id="rows"></tbody></table>
</div>
<script>
  const KEY = "earnings-v1", MONTH_GOAL = 633600, GOAL_RATE = 1;
  const fmt = n => Math.round(n).toLocaleString("hy-AM") + " ֏";
  let items = [];
  try { items = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { items = []; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {} };

  function render() {
    const total = items.reduce((s, x) => s + x.amount, 0);
    const hours = items.reduce((s, x) => s + x.hours, 0);
    const rate = hours ? total / (hours * 3600) : 0;
    const ym = new Date().toISOString().slice(0, 7);
    const month = items.filter(x => x.date.startsWith(ym)).reduce((s, x) => s + x.amount, 0);

    document.getElementById("total").textContent = fmt(total);
    document.getElementById("hours").textContent = hours.toLocaleString("hy-AM");
    const r = document.getElementById("rate");
    r.textContent = rate.toFixed(2) + " ֏/վրկ";
    r.className = "value" + (rate >= GOAL_RATE ? " ok" : "");
    document.getElementById("month").textContent = fmt(month);
    document.getElementById("monthbar").style.width = Math.min(100, month / MONTH_GOAL * 100) + "%";
    document.getElementById("verdict").textContent = !hours ? "Ավելացրու առաջին եկամուտը 👇"
      : rate >= GOAL_RATE ? "✅ Նպատակը կատարված է․ վաստակում ես ≥ 1 ֏/վայրկյան։"
      : "Մինչև նպատակը պակասում է " + ((GOAL_RATE - rate) * 3600).toFixed(0) + " ֏/ժամ։ Բարձրացրու գները կամ արագացրու աշխատանքը։";

    const tb = document.getElementById("rows"); tb.innerHTML = "";
    items.slice().sort((a, b) => b.date.localeCompare(a.date)).forEach(x => {
      const tr = document.createElement("tr");
      [x.date, x.note || ""].forEach(t => { const td = document.createElement("td"); td.textContent = t; tr.appendChild(td); });
      [x.amount.toLocaleString("hy-AM"), x.hours].forEach(t => { const td = document.createElement("td"); td.className = "num"; td.textContent = t; tr.appendChild(td); });
      const td = document.createElement("td"), b = document.createElement("button");
      b.className = "del"; b.textContent = "✕"; b.title = "Ջնջել";
      b.onclick = () => { items = items.filter(y => y.id !== x.id); save(); render(); };
      td.appendChild(b); tr.appendChild(td); tb.appendChild(tr);
    });
  }

  document.getElementById("d").valueAsDate = new Date();
  document.getElementById("f").onsubmit = e => {
    e.preventDefault();
    items.push({ id: Date.now(), date: d.value, amount: +a.value, hours: +h.value, note: n.value.trim() });
    save(); a.value = h.value = n.value = ""; render();
  };
  render();
</script>
</body>
</html>
