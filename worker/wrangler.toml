# Անհրաժեշտ է միայն համակարգչից wrangler-ով տեղադրելու համար։
# iPhone-ից տեղադրելիս այս ֆայլը պետք չէ (տե՛ս README.md)։
name = "barber-bot"
main = "worker.js"
compatibility_date = "2026-10-01"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "barber-bot"
database_id = "REPLACE_WITH_YOUR_D1_ID"
