<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Հարսանյաց հրավեր</title>
<meta property="og:title" content="Հարսանյաց հրավեր">
<meta property="og:description" content="Սիրով հրավիրում ենք Ձեզ մեր հարսանիքին">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Armenian:wght@300;400;600&family=Noto+Sans+Armenian:wght@300;400;600&display=swap" rel="stylesheet">
<script>
/* =====================================================================
   ՊԱՏՎԵՐԻ ՏՎՅԱԼՆԵՐ — նոր պատվերի համար փոխիր ՄԻԱՅՆ այս բլոկը
   ===================================================================== */
const CONFIG = {
  theme: "classic",                 // "classic" (կրեմ/ոսկի) կամ "modern" (մուգ կանաչ)
  groom: "Արամ",
  bride: "Անի",
  date: "2027-06-19T15:00:00",      // ՏՏՏՏ-ԱԱ-ՕՕTԺԺ:ՐՐ:00 (Երևանի ժամով)
  photo: "",                        // նկարի հղում (դատարկ = զարդանախշ)
  intro: "Սիրով հրավիրում ենք Ձեզ կիսելու մեր կյանքի ամենաերջանիկ օրը",
  quote: "Սերը համբերող է, քաղցր է… Սերը երբեք չի անցնում։",
  quoteAuthor: "Ա Կորնթացիս 13",
  events: [
    { time: "15:00", title: "Պսակադրություն", place: "Սուրբ Գայանե եկեղեցի", address: "Սուրբ Գայանե եկեղեցի, Վաղարշապատ" },
    { time: "18:00", title: "Հարսանյաց խնջույք", place: "«Արարատ Հոլլ» ռեստորան", address: "Երևան, Ծովակալ Իսակովի պողոտա" }
  ],
  dressCode: "Խնդրում ենք նախընտրել պաստելային երանգներ",
  rsvpDeadline: "մինչև մայիսի 30-ը",
  whatsapp: "37400000000",          // RSVP պատասխանները կգան այս համարին (առանց +)
  footer: "Սպասում ենք Ձեզ"
};
</script>
<style>
:root{
  --bg:#fbf7f0; --bg2:#f3ebdd; --ink:#3d3328; --muted:#8a7a66; --accent:#b08d57; --accent2:#d9c29a;
  --card:#fffdf9; --serif:"Noto Serif Armenian",Georgia,serif; --sans:"Noto Sans Armenian",system-ui,sans-serif;
}
[data-theme="modern"]{
  --bg:#1f2b26; --bg2:#26352f; --ink:#f1ede4; --muted:#a9b5ad; --accent:#d8b98a; --accent2:#5d7a6c; --card:#2b3b34;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.7;overflow-x:hidden}
section{padding:72px 20px;text-align:center}
.wrap{max-width:640px;margin:0 auto}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(26px,6vw,36px);margin-bottom:24px;color:var(--accent)}
.orn{width:180px;height:auto;color:var(--accent);margin:18px auto;display:block;opacity:.9}

/* hero */
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;background:radial-gradient(ellipse at top,var(--bg2),var(--bg) 70%)}
.hero .pre{letter-spacing:.35em;text-transform:uppercase;font-size:12px;color:var(--muted)}
.names{font-family:var(--serif);font-weight:300;font-size:clamp(48px,14vw,96px);line-height:1.1;margin:10px 0}
.names .amp{display:block;font-size:.45em;color:var(--accent);margin:6px 0}
.hero .date{font-family:var(--serif);font-size:20px;letter-spacing:.12em}
.photo{width:220px;height:280px;object-fit:cover;border-radius:110px 110px 12px 12px;border:1px solid var(--accent2);margin-bottom:24px}
.scroll{position:absolute;bottom:28px;font-size:12px;color:var(--muted);letter-spacing:.2em;animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(6px)}}
[data-theme="modern"] .names{font-family:var(--sans);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
[data-theme="modern"] .hero{background:linear-gradient(160deg,#2b3d35,#1a2420)}

.intro{font-family:var(--serif);font-size:20px;max-width:520px;margin:0 auto}

/* countdown */
.count{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.count div{background:var(--card);border:1px solid var(--accent2);border-radius:14px;width:76px;padding:14px 0}
.count b{display:block;font-family:var(--serif);font-weight:400;font-size:30px;color:var(--accent);line-height:1.2}
.count span{font-size:12px;color:var(--muted)}
.cal{display:inline-block;margin-top:24px}

/* events */
.events{display:grid;gap:18px}
.ev{background:var(--card);border:1px solid var(--accent2);border-radius:18px;padding:28px 20px}
.ev .t{font-family:var(--serif);font-size:30px;color:var(--accent)}
.ev h3{font-family:var(--serif);font-weight:400;font-size:22px;margin:4px 0}
.ev p{color:var(--muted);margin-bottom:16px}
.btn{display:inline-block;padding:11px 22px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);text-decoration:none;font-size:14px;margin:4px;background:transparent;font-family:inherit;cursor:pointer;transition:.2s}
.btn:hover,.btn.solid{background:var(--accent);color:var(--bg)}

.quote{font-family:var(--serif);font-style:italic;font-size:20px;max-width:500px;margin:0 auto}
.quote small{display:block;margin-top:10px;font-style:normal;font-size:13px;color:var(--muted)}
.alt{background:var(--bg2)}

/* rsvp */
form{display:grid;gap:14px;text-align:left;max-width:420px;margin:0 auto}
label{font-size:14px;color:var(--muted)}
input,textarea,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--accent2);background:var(--card);color:var(--ink);font:inherit;font-size:16px}
.radios{display:flex;gap:10px}
.radios label{flex:1;border:1px solid var(--accent2);border-radius:12px;padding:12px;text-align:center;cursor:pointer;color:var(--ink);background:var(--card)}
.radios input{display:none}
.radios input:checked+span{color:var(--accent);font-weight:600}
.radios label:has(input:checked){border-color:var(--accent)}
form .btn{width:100%;padding:14px;font-size:16px}
footer{padding:60px 20px 80px;text-align:center;font-family:var(--serif);font-size:24px;color:var(--accent)}
footer small{display:block;font-family:var(--sans);font-size:11px;color:var(--muted);margin-top:30px;letter-spacing:.1em}

.reveal{opacity:0;transform:translateY(24px);transition:1s ease}
.reveal.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none}.scroll{animation:none}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <symbol id="orn" viewBox="0 0 200 24"><g fill="none" stroke="currentColor" stroke-width="1"><path d="M0 12h78M122 12h78"/><path d="M100 2c6 6 6 14 0 20c-6-6-6-14 0-20z"/><circle cx="86" cy="12" r="3"/><circle cx="114" cy="12" r="3"/></g></symbol>
</svg>

<section class="hero">
  <img class="photo" id="photo" alt="" hidden>
  <div class="pre" id="pre">Հարսանյաց հրավեր</div>
  <h1 class="names" id="names"></h1>
  <svg class="orn"><use href="#orn"/></svg>
  <div class="date" id="heroDate"></div>
  <div class="scroll">↓</div>
</section>

<section><div class="wrap reveal">
  <p class="intro" id="intro"></p>
  <svg class="orn"><use href="#orn"/></svg>
</div></section>

<section class="alt"><div class="wrap reveal">
  <h2>Մինչև մեծ օրը մնաց</h2>
  <div class="count" id="count">
    <div><b id="cd">0</b><span>օր</span></div>
    <div><b id="ch">0</b><span>ժամ</span></div>
    <div><b id="cm">0</b><span>րոպե</span></div>
    <div><b id="cs">0</b><span>վայրկյան</span></div>
  </div>
  <a class="btn cal" id="cal" target="_blank" rel="noopener">＋ Ավելացնել օրացույցում</a>
</div></section>

<section><div class="wrap reveal">
  <h2>Օրվա ծրագիրը</h2>
  <div class="events" id="events"></div>
</div></section>

<section class="alt" id="quoteSec"><div class="wrap reveal">
  <p class="quote" id="quote"></p>
</div></section>

<section id="dressSec"><div class="wrap reveal">
  <h2>Դրես կոդ</h2>
  <p id="dress"></p>
</div></section>

<section class="alt"><div class="wrap reveal">
  <h2>Կմասնակցե՞ք</h2>
  <p style="margin-bottom:24px;color:var(--muted)">Խնդրում ենք հաստատել Ձեր մասնակցությունը <span id="deadline"></span></p>
  <form id="rsvp">
    <div><label>Անուն, ազգանուն</label><input name="name" required autocomplete="name"></div>
    <div class="radios">
      <label><input type="radio" name="go" value="yes" checked><span>Կգամ ❤</span></label>
      <label><input type="radio" name="go" value="no"><span>Չեմ կարող</span></label>
    </div>
    <div><label>Քանի՞ հոգի</label><select name="n"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
    <div><label>Ցանկություն / մաղթանք</label><textarea name="msg" rows="3"></textarea></div>
    <button class="btn solid" type="submit">Ուղարկել պատասխանը</button>
  </form>
</div></section>

<footer><div id="footer"></div><svg class="orn"><use href="#orn"/></svg><small id="sig"></small></footer>

<script>
const C = CONFIG, $ = id => document.getElementById(id);
document.documentElement.dataset.theme = C.theme;
const months = ["հունվարի","փետրվարի","մարտի","ապրիլի","մայիսի","հունիսի","հուլիսի","օգոստոսի","սեպտեմբերի","հոկտեմբերի","նոյեմբերի","դեկտեմբերի"];
const weekdays = ["Կիրակի","Երկուշաբթի","Երեքշաբթի","Չորեքշաբթի","Հինգշաբթի","Ուրբաթ","Շաբաթ"];
const target = new Date(C.date + "+04:00");
const local = new Date(C.date); // for display (as written)

document.title = `${C.groom} և ${C.bride} — Հարսանյաց հրավեր`;
$("names").innerHTML = `${C.groom}<span class="amp">&</span>${C.bride}`;
$("heroDate").textContent = `${local.getDate()} ${months[local.getMonth()]} ${local.getFullYear()} · ${weekdays[local.getDay()]}`;
if (C.photo) { $("photo").src = C.photo; $("photo").hidden = false; }
$("intro").textContent = C.intro;
if (C.quote) $("quote").innerHTML = `«${C.quote}»<small>${C.quoteAuthor||""}</small>`; else $("quoteSec").remove();
if (C.dressCode) $("dress").textContent = C.dressCode; else $("dressSec").remove();
$("deadline").textContent = C.rsvpDeadline || "";
$("footer").textContent = C.footer;
$("sig").textContent = `${C.groom} & ${C.bride}`;

$("events").innerHTML = C.events.map(e => {
  const q = encodeURIComponent(e.address);
  return `<div class="ev"><div class="t">${e.time}</div><h3>${e.title}</h3><p>${e.place}</p>
    <a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${q}">Google Maps</a>
    <a class="btn" target="_blank" rel="noopener" href="https://yandex.com/maps/?text=${q}">Yandex</a></div>`;
}).join("");

// add to Google Calendar
const z = d => d.toISOString().replace(/[-:]|\.\d{3}/g, "");
const end = new Date(target.getTime() + 8 * 3600e3);
$("cal").href = "https://calendar.google.com/calendar/render?action=TEMPLATE" +
  "&text=" + encodeURIComponent(`${C.groom} և ${C.bride} հարսանիք`) +
  "&dates=" + z(target) + "/" + z(end) +
  "&location=" + encodeURIComponent(C.events[0]?.address || "");

// countdown
function tick(){
  let s = Math.max(0, Math.floor((target - Date.now()) / 1000));
  $("cd").textContent = Math.floor(s / 86400); s %= 86400;
  $("ch").textContent = Math.floor(s / 3600);  s %= 3600;
  $("cm").textContent = Math.floor(s / 60);
  $("cs").textContent = s % 60;
}
tick(); setInterval(tick, 1000);

// RSVP -> WhatsApp
$("rsvp").addEventListener("submit", e => {
  e.preventDefault();
  const f = new FormData(e.target), yes = f.get("go") === "yes";
  const text = `💌 RSVP — ${C.groom} & ${C.bride}\n` +
    `Անուն: ${f.get("name")}\n` +
    (yes ? `✅ Կգա, ${f.get("n")} հոգի` : `❌ Չի կարող գալ`) +
    (f.get("msg") ? `\nՄաղթանք: ${f.get("msg")}` : "");
  window.open(`https://wa.me/${C.whatsapp}?text=${encodeURIComponent(text)}`, "_blank");
});

// reveal on scroll
const io = new IntersectionObserver(es => es.forEach(x => x.isIntersecting && x.target.classList.add("on")), {threshold:.15});
document.querySelectorAll(".reveal").forEach(el => io.observe(el));
</script>
</body>
</html>
