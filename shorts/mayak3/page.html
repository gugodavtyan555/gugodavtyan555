<script>
const W=1080,H=1920,cv=document.getElementById('c'),X=cv.getContext('2d');
const off=document.createElement('canvas');off.width=W;off.height=H;const XO=off.getContext('2d');
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=t=>{t=clamp(t);return t*t*(3-2*t)},easeOut=t=>1-Math.pow(1-clamp(t),3);
const back=t=>{t=clamp(t);const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const STARS=(()=>{const r=rng(7);return Array.from({length:170},()=>({x:r()*W,y:r()*1100,r:0.6+r()*1.9,p:r()*6.28,s:0.6+r()*2}))})();
// grain
const GR=document.createElement('canvas');GR.width=GR.height=256;(()=>{const g=GR.getContext('2d'),d=g.createImageData(256,256),r=rng(3);for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0)})();

function sky(c,cols,hy){const g=c.createLinearGradient(0,0,0,hy);cols.forEach((k,i)=>g.addColorStop(i/(cols.length-1),k));c.fillStyle=g;c.fillRect(0,0,W,hy+2)}
function stars(c,t,maxY,a=1){for(const s of STARS){if(s.y>maxY)continue;const al=(0.45+0.55*Math.sin(t*s.s+s.p))*a*(1-s.y/maxY*0.7);c.fillStyle=`rgba(235,240,255,${al})`;c.beginPath();c.arc(s.x,s.y,s.r,0,7);c.fill()}}
function glow(c,x,y,r,col,a=1){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col.replace('A',a));g.addColorStop(1,col.replace('A',0));c.save();c.globalCompositeOperation='lighter';c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill();c.restore()}
function moon(c,x,y,r){glow(c,x,y,r*5.5,'rgba(150,180,255,A)',0.22);glow(c,x,y,r*2.2,'rgba(255,240,200,A)',0.35);
 const g=c.createRadialGradient(x-r*0.3,y-r*0.3,r*0.1,x,y,r);g.addColorStop(0,'#fffaf0');g.addColorStop(1,'#f1d9a6');c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill();
 c.fillStyle='rgba(190,160,110,0.28)';[[-.3,-.2,.2],[.25,.1,.26],[-.1,.42,.14],[.4,-.4,.1]].forEach(([a,b,q])=>{c.beginPath();c.arc(x+a*r,y+b*r,q*r,0,7);c.fill()})}
function clouds(c,t,y0,col,seed=1,n=5){const r=rng(seed);c.save();c.filter='blur(28px)';c.fillStyle=col;for(let i=0;i<n;i++){const x=((r()*1500+t*(8+r()*10))%1500)-200,y=y0+r()*260,w=220+r()*300;c.beginPath();c.ellipse(x,y,w,26+r()*26,0,0,7);c.fill()}c.restore()}
function sea(c,hy,t,top,bot,mx,bottom=H){const g=c.createLinearGradient(0,hy,0,bottom);g.addColorStop(0,top);g.addColorStop(1,bot);c.fillStyle=g;c.fillRect(0,hy,W,bottom-hy);
 c.save();c.lineCap='round';const N=26;for(let i=0;i<N;i++){const k=i/N,y=hy+4+Math.pow(k,1.7)*(bottom-hy),amp=2+k*16,wl=60+k*240;c.beginPath();for(let x=-20;x<=W+20;x+=24){const yy=y+Math.sin(x/wl+t*(1.4-k*0.6)+i*1.7)*amp+Math.sin(x/(wl*0.37)+t*2+i)*amp*0.3;x<0?c.moveTo(x,yy):c.lineTo(x,yy)}c.strokeStyle=`rgba(150,195,235,${0.05+k*0.10})`;c.lineWidth=1.5+k*5;c.stroke()}
 if(mx!=null){c.globalCompositeOperation='lighter';for(let i=0;i<34;i++){const k=i/34,y=hy+6+Math.pow(k,1.5)*(bottom-hy)*0.9,w=(14+k*120)*(0.6+0.4*Math.sin(t*2.3+i*2.1)),x=mx+Math.sin(t*1.3+i*1.9)*(6+k*40);c.strokeStyle=`rgba(255,236,190,${0.30*(1-k*0.75)})`;c.lineWidth=2+k*5;c.beginPath();c.moveTo(x-w,y);c.lineTo(x+w,y);c.stroke()}}c.restore()}
function vignette(c,fi){const g=c.createRadialGradient(W/2,H*0.46,H*0.28,W/2,H*0.5,H*0.78);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,8,0.62)');c.fillStyle=g;c.fillRect(0,0,W,H);
 c.save();c.globalAlpha=0.055;c.globalCompositeOperation='overlay';const ox=(fi*73)%256,oy=(fi*151)%256;for(let x=-ox;x<W;x+=256)for(let y=-oy;y<H;y+=256)c.drawImage(GR,x,y);c.restore()}

// ---------- stickman rig ----------
function shade(hex,k){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.round(clamp(v*k,0,255));return`rgb(${f(r)},${f(g)},${f(b)})`}
function stick(c,o){const s=o.s||1,f=o.face||1,col=o.col||'#6f86a8',lw=30*s,P=o.pose||{};
 const TH=96*s,SH=96*s,TO=178*s,UA=78*s,FA=78*s,HR=60*s;
 const lean=P.lean||0,hipY=o.y-(P.crouch?(TH+SH)*(1-P.crouch):TH+SH)+(P.bob||0);
 const hip={x:o.x,y:hipY},neck={x:hip.x+Math.sin(lean)*TO*f,y:hip.y-Math.cos(lean)*TO};
 const head={x:neck.x+Math.sin(lean+(P.headTilt||0))*HR*0.92*f,y:neck.y-Math.cos(lean+(P.headTilt||0))*HR*0.92};
 const seg=(p,a,l)=>({x:p.x+Math.sin(a)*l*f,y:p.y+Math.cos(a)*l});
 const limb=(p,a1,a2,l1,l2,cl)=>{const m=seg(p,a1,l1),e=seg(m,a2,l2);c.strokeStyle=cl;c.lineWidth=lw;c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(p.x,p.y);c.lineTo(m.x,m.y);c.lineTo(e.x,e.y);c.stroke();return e};
 const dark=shade(col,0.66);
 if(o.shadow!==false){c.fillStyle='rgba(0,0,0,0.35)';c.beginPath();c.ellipse(o.x,o.y+6*s,95*s,13*s,0,0,7);c.fill()}
 const LL=P.legL||[0.1,0.05],LR=P.legR||[-0.1,-0.12],AL=P.armL||[0.15,0.35],AR=P.armR||[-0.15,0.1];
 const sh={x:neck.x-Math.sin(lean)*20*s*f,y:neck.y+Math.cos(lean)*20*s};
 const hb=limb(sh,AR[0],AR[1],UA,FA,dark);          // back arm
 if(!o.noLegs){limb(hip,LR[0],LR[1],TH,SH,dark);}
 c.strokeStyle=col;c.lineWidth=lw*1.12;c.lineCap='round';c.beginPath();c.moveTo(hip.x,hip.y);c.lineTo(neck.x,neck.y);c.stroke();
 if(!o.noLegs){limb(hip,LL[0],LL[1],TH,SH,col);}
 if(o.scarf){c.strokeStyle=o.scarf;c.lineWidth=20*s;c.beginPath();c.moveTo(neck.x+f*14*s,neck.y+10*s);for(let i=1;i<=6;i++){c.lineTo(neck.x-f*(i*26*s),neck.y+12*s+Math.sin(o.t*5+i*0.9)*i*4*s+i*3*s)}c.stroke();c.lineWidth=26*s;c.beginPath();c.moveTo(neck.x-12*s,neck.y+8*s);c.lineTo(neck.x+12*s,neck.y+8*s);c.stroke()}
 // head
 c.fillStyle='#0c0c12';c.beginPath();c.arc(head.x,head.y,HR,0,7);c.fill();
 if(o.rim){c.save();c.beginPath();c.arc(head.x,head.y,HR,0,7);c.clip();c.strokeStyle=o.rim;c.lineWidth=7*s;c.beginPath();c.arc(head.x+(o.rimDir||-1)*5*s,head.y+2*s,HR-1*s,0,7);c.stroke();c.restore()}
 if(o.beard){c.fillStyle='#d9dde6';c.beginPath();c.moveTo(head.x+f*HR*0.02,head.y+HR*0.99);c.quadraticCurveTo(head.x+f*HR*0.5,head.y+HR*0.8,head.x+f*HR*0.9,head.y+HR*0.42);c.quadraticCurveTo(head.x+f*HR*0.95,head.y+HR*1.1,head.x+f*HR*0.5,head.y+HR*1.5);c.quadraticCurveTo(head.x+f*HR*0.15,head.y+HR*1.35,head.x+f*HR*0.02,head.y+HR*0.99);c.fill()}
 const E=o.eyes||{},bl=E.blink||0,wd=E.wide||1,ey=head.y-HR*0.12+(E.dy||0)*s;
 if(!o.back)for(const dx of [0.2,0.62]){const ex=head.x+f*dx*HR+(E.dx||0)*s;c.fillStyle='#f6f6f6';c.beginPath();c.ellipse(ex,ey,HR*0.15*wd,HR*0.17*wd*(1-bl*0.92),0,0,7);c.fill()}
 if(E.sad&&!o.back){c.strokeStyle='#0c0c12';c.lineWidth=7*s;c.beginPath();c.moveTo(head.x+f*HR*0.0,ey-HR*0.34);c.lineTo(head.x+f*HR*0.86,ey-HR*0.18);c.stroke()}
 if(o.hat){c.fillStyle=o.hat;c.beginPath();c.moveTo(head.x-HR*1.02,head.y-HR*0.38);c.quadraticCurveTo(head.x,head.y-HR*1.75,head.x+HR*1.02,head.y-HR*0.38);c.closePath();c.fill();c.beginPath();c.roundRect(f>0?head.x+HR*0.2:head.x-HR*1.55,head.y-HR*0.5,HR*1.35,HR*0.2,HR*0.1);c.fill()}
 const hf=limb(sh,AL[0],AL[1],UA,FA,col);            // front arm
 return {head,neck,hip,hf,hb,HR}}
const walk=(ph,amp=0.5)=>({legL:[Math.sin(ph)*amp,Math.sin(ph)*amp-Math.max(0,Math.sin(ph+1.3))*0.8],legR:[-Math.sin(ph)*amp,-Math.sin(ph)*amp-Math.max(0,Math.sin(ph+1.3+Math.PI))*0.8],armR:[Math.sin(ph)*0.45,Math.sin(ph)*0.45+0.35],bob:-Math.abs(Math.sin(ph))*7});
function lantern(c,p,s,t,pow=1){const fl=0.9+0.1*Math.sin(t*17)+0.05*Math.sin(t*31);glow(c,p.x,p.y+34*s,330*s*fl,'rgba(255,170,70,A)',0.30*pow);glow(c,p.x,p.y+34*s,90*s,'rgba(255,225,150,A)',0.9*pow);
 c.strokeStyle='#15131c';c.lineWidth=5*s;c.beginPath();c.arc(p.x,p.y+12*s,14*s,Math.PI,0);c.stroke();c.fillStyle='#15131c';c.fillRect(p.x-17*s,p.y+10*s,34*s,8*s);c.fillRect(p.x-19*s,p.y+56*s,38*s,9*s);
 c.fillStyle=`rgba(255,214,120,${0.95*pow})`;c.beginPath();c.roundRect(p.x-13*s,p.y+18*s,26*s,38*s,5*s);c.fill()}

// ---------- lighthouse ----------
function lighthouse(c,x,by,h,t){const wb=h*0.25,wt=h*0.155,ty=by-h*0.78;
 c.save();c.beginPath();c.moveTo(x-wb/2,by);c.lineTo(x-wt/2,ty);c.lineTo(x+wt/2,ty);c.lineTo(x+wb/2,by);c.closePath();c.clip();
 const g=c.createLinearGradient(x-wb/2,0,x+wb/2,0);g.addColorStop(0,'#eeeadf');g.addColorStop(0.45,'#bdb9bf');g.addColorStop(1,'#4d4b62');c.fillStyle=g;c.fillRect(x-wb,ty,wb*2,by-ty);
 const g2=c.createLinearGradient(x-wb/2,0,x+wb/2,0);g2.addColorStop(0,'#c9564a');g2.addColorStop(0.5,'#93372f');g2.addColorStop(1,'#3d1a22');c.fillStyle=g2;for(const k of [0.08,0.4,0.72])c.fillRect(x-wb,ty+(by-ty)*k,wb*2,(by-ty)*0.16);
 c.restore();
 c.fillStyle='#1b1722';c.beginPath();c.roundRect(x-h*0.035,by-h*0.11,h*0.07,h*0.11,[h*0.035,h*0.035,0,0]);c.fill();glow(c,x,by-h*0.05,h*0.1,'rgba(255,180,90,A)',0.5);c.fillStyle='#ffc978';c.beginPath();c.roundRect(x-h*0.022,by-h*0.095,h*0.044,h*0.095,[h*0.022,h*0.022,0,0]);c.fill();
 c.fillStyle='#ffd58a';for(const k of [0.3,0.62]){c.beginPath();c.roundRect(x-h*0.016,ty+(by-ty)*k,h*0.032,h*0.05,h*0.016);c.fill()}
 // gallery
 c.fillStyle='#141220';c.fillRect(x-wt*0.95,ty-h*0.02,wt*1.9,h*0.022);c.strokeStyle='#141220';c.lineWidth=h*0.006;for(let i=0;i<=8;i++){const xx=x-wt*0.9+i*wt*1.8/8;c.beginPath();c.moveTo(xx,ty-h*0.02);c.lineTo(xx,ty-h*0.06);c.stroke()}c.beginPath();c.moveTo(x-wt*0.92,ty-h*0.06);c.lineTo(x+wt*0.92,ty-h*0.06);c.stroke();
 const ly=ty-h*0.085,lw2=wt*0.62;
 c.fillStyle='#fff0b8';c.fillRect(x-lw2/2,ty-h*0.15,lw2,h*0.13);c.strokeStyle='#141220';c.lineWidth=h*0.008;c.strokeRect(x-lw2/2,ty-h*0.15,lw2,h*0.13);c.beginPath();c.moveTo(x,ty-h*0.15);c.lineTo(x,ty-h*0.02);c.stroke();
 c.fillStyle='#7c2b2b';c.beginPath();c.moveTo(x-lw2*0.72,ty-h*0.15);c.quadraticCurveTo(x,ty-h*0.27,x+lw2*0.72,ty-h*0.15);c.closePath();c.fill();c.beginPath();c.arc(x,ty-h*0.215,h*0.012,0,7);c.fill();
 return {x,y:ly}}
function beam(c,L,th,len=1500,pow=1){const dx=Math.cos(th),front=Math.sin(th)>0,ad=Math.abs(dx);c.save();c.globalCompositeOperation='lighter';
 c.filter='blur(5px)';for(const sg of [1,-1]){const d=dx*sg,l=len*Math.abs(d)+120,sp=(0.07+0.22*(1-ad)),dir=d>=0?1:-1,a=(0.16+0.3*ad)*pow;
  const g=c.createLinearGradient(L.x,0,L.x+dir*l,0);g.addColorStop(0,`rgba(255,238,170,${a})`);g.addColorStop(1,'rgba(255,238,170,0)');c.fillStyle=g;c.beginPath();c.moveTo(L.x,L.y-6);c.lineTo(L.x+dir*l,L.y-l*sp-l*0.04);c.lineTo(L.x+dir*l,L.y+l*sp-l*0.04);c.lineTo(L.x,L.y+6);c.closePath();c.fill()}
 c.restore();glow(c,L.x,L.y,(110+(front?(1-ad)*260:0))*Math.sqrt(pow),'rgba(255,240,180,A)',0.85*pow);glow(c,L.x,L.y,36,'rgba(255,255,240,A)',1)}
function rocks(c,pts,top,bot,rim){const sm=()=>{c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length-1;i++){c.quadraticCurveTo(pts[i][0],pts[i][1],(pts[i][0]+pts[i+1][0])/2,(pts[i][1]+pts[i+1][1])/2)}c.lineTo(pts[pts.length-1][0],pts[pts.length-1][1])};c.beginPath();c.moveTo(pts[0][0],H+10);c.lineTo(pts[0][0],pts[0][1]);sm();c.lineTo(pts[pts.length-1][0],H+10);c.closePath();const ys=pts.map(p=>p[1]);const g=c.createLinearGradient(0,Math.min(...ys),0,H);g.addColorStop(0,top);g.addColorStop(1,bot);c.fillStyle=g;c.fill();
 if(rim){c.strokeStyle=rim;c.lineWidth=5;c.lineJoin='round';c.beginPath();sm();c.stroke()}}
function grass(c,x0,x1,yf,t,seed,col='#0b1220'){const r=rng(seed);c.strokeStyle=col;c.lineCap='round';for(let x=x0;x<x1;x+=9+r()*14){const h=14+r()*30,sw=Math.sin(t*1.8+x*0.02)*7;c.lineWidth=3+r()*2;c.beginPath();c.moveTo(x,yf(x)+3);c.quadraticCurveTo(x+sw*0.4,yf(x)-h*0.6,x+sw+(r()-0.5)*10,yf(x)-h);c.stroke()}}
function cam(c,cx,cy,z,dx=0,dy=0){c.translate(cx+dx,cy+dy);c.scale(z,z);c.translate(-cx,-cy)}

// ================= SHOTS =================
const OLD={col:'#7389ad',hat:'#2a2f44',beard:true,rim:'rgba(170,195,255,0.55)'};
function shotA(c,t,d,T){ // wide: lighthouse
 const hy=1210;c.save();cam(c,700,900,1.0+0.09*ease(t/d),0,0);
 sky(c,['#070a1c','#101a3c','#243a66','#3f5a86'],hy);stars(c,T,hy);clouds(c,T,560,'rgba(120,150,210,0.16)',4);moon(c,235,470,74);
 rocks(c,[[-60,1190],[40,1168],[150,1176],[260,1196],[330,1206],[400,1214]],'#1c2a4a','#132040');sea(c,hy,T,'#27446d','#060b18',235);
 // far headland
 
 const L={x:742,y:0};
 rocks(c,[[-120,1560],[120,1500],[300,1420],[420,1330],[520,1250],[600,1215],[690,1196],[820,1192],[930,1210],[1010,1260],[1120,1290]],'#1b2640','#070a14','rgba(150,180,240,0.28)');
 const lamp=lighthouse(c,742,1200,700,T);
 beam(c,lamp,T*1.5+0.6,1700);
 const yf=x=>x<520?lerp(1330,1250,(x-420)/100):x<600?lerp(1250,1215,(x-520)/80):x<690?lerp(1215,1196,(x-600)/90):1194;
 grass(c,430,1080,yf,T,5,'#0a1020');
 const px=lerp(440,640,ease(t/d)),py=yf(px)+4;const ph=T*6.5;
 const m=stick(c,{...OLD,x:px,y:py,s:0.6,face:1,t:T,pose:{...walk(ph,0.45),lean:0.16,armL:[0.75,1.35]}});lantern(c,m.hf,0.6,T);
 // foreground rocks
 rocks(c,[[-80,1700],[40,1600],[150,1570],[260,1620],[380,1700],[520,1740],[700,1715],[860,1760],[1000,1700],[1160,1730]],'#0a0e1c','#03040a');
 c.restore()}
function shotB(c,t,d,T){ // empty sea
 const hy=980;c.save();cam(c,540,900,1.12,lerp(40,-40,t/d),0);
 sky(c,['#060818','#0d1634','#1f3360','#3a5582'],hy);stars(c,T,hy);clouds(c,T,640,'rgba(120,150,210,0.18)',9,6);moon(c,820,400,60);
 sea(c,hy,T,'#223d66','#050914',820);
 // sweeping light patch on water
 const k=(t/d),sx=lerp(1300,-250,ease(k));c.save();c.globalCompositeOperation='lighter';const g=c.createRadialGradient(sx,1250,0,sx,1250,520);g.addColorStop(0,'rgba(255,236,170,0.34)');g.addColorStop(1,'rgba(255,236,170,0)');c.fillStyle=g;c.save();c.translate(sx,1250);c.scale(1,0.34);c.translate(-sx,-1250);c.beginPath();c.arc(sx,1250,520,0,7);c.fill();c.restore();
 c.filter='blur(14px)';const g2=c.createLinearGradient(1250,560,sx,1250);g2.addColorStop(0,'rgba(255,236,170,0.26)');g2.addColorStop(1,'rgba(255,236,170,0.02)');c.fillStyle=g2;c.beginPath();c.moveTo(1250,540);c.lineTo(sx-420,1250);c.lineTo(sx+420,1250);c.closePath();c.fill();c.restore();
 // wreck mast + buoy
 c.save();c.translate(300,hy+150);c.rotate(-0.22+Math.sin(T*0.9)*0.015);c.fillStyle='#070b16';c.fillRect(-7,-250,14,260);c.fillRect(-70,-180,140,9);c.beginPath();c.moveTo(-120,10);c.quadraticCurveTo(0,-46,150,6);c.lineTo(120,30);c.lineTo(-100,30);c.closePath();c.fill();c.strokeStyle='#070b16';c.lineWidth=3;c.beginPath();c.moveTo(0,-250);c.lineTo(-68,-176);c.moveTo(0,-250);c.lineTo(68,-176);c.stroke();c.restore();
 const by=hy+330+Math.sin(T*1.6)*10;c.save();c.translate(760,by);c.rotate(Math.sin(T*1.6+1)*0.12);c.fillStyle='#8f2f2b';c.beginPath();c.moveTo(-34,0);c.lineTo(-18,-78);c.lineTo(18,-78);c.lineTo(34,0);c.closePath();c.fill();c.fillStyle='#0a0e1a';c.fillRect(-5,-112,10,36);c.restore();
 // mist
