<title>Բեքթեստ 10վ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#f6f7f9;--fg:#14181f;--mut:#5b6573;--card:#fff;--line:#dde1e7;--acc:#1f6feb;--bad:#c62828;--good:#1b7f3b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--fg:#e8ecf1;--mut:#97a2b1;--card:#181e26;--line:#2a3340;--acc:#5b9bff;--bad:#ff6b6b;--good:#4cc27a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1318;--fg:#e8ecf1;--mut:#97a2b1;--card:#181e26;--line:#2a3340;--acc:#5b9bff;--bad:#ff6b6b;--good:#4cc27a;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:560px;margin:auto;display:grid;gap:14px}
h1{font-size:1.3rem;margin:0}
p{margin:0;color:var(--mut);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px}
label{display:grid;gap:4px;font-size:.85rem;color:var(--mut)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px;min-width:0;width:100%;box-sizing:border-box}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;font-weight:600;background:var(--acc);color:#fff;border:0;border-radius:8px;padding:12px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
dl{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:0;font-variant-numeric:tabular-nums}
dd{margin:0;font-weight:600;text-align:right}
.bad{color:var(--bad)}.good{color:var(--good)}
</style>
<main>
<h1>Բեքթեստ՝ 10 վայրկյան + պարլեյ</h1>
<p>Տվյալները՝ սինթետիկ պատահական գին, կամ քո CSV-ն (յուրաքանչյուր տողում 1 վայրկյանի գինը)։</p>
<div class="card">
<div class="row">
<label>Ռազմավարություն
<select id="strat"><option value="mom">Մոմենտում (հետևել)</option><option value="rev">Հակառակ (հակադարձ)</option><option value="rsi">RSI 14 (30/70)</option></select></label>
<label>Հետադարձ (վրկ)<input id="lb" type="number" value="5" min="1"></label>
</div>
<div class="row">
<label>Վճարում %<input id="pay" type="number" value="85" min="1" max="100"></label>
<label>Սկիզբ → Թիրախ $<input id="tgt" type="number" value="20000" min="2"></label>
</div>
<label>CSV գներ (ընտրիր ֆայլ կամ կպցրու)
<input id="file" type="file" accept=".csv,.txt"></label>
<textarea id="txt" rows="3" placeholder="0.65296&#10;0.65301&#10;..."></textarea>
<button id="go">Աշխատեցնել</button>
</div>
<div class="card" id="out" hidden><dl id="dl"></dl></div>
</main>
<script>
const $=id=>document.getElementById(id);
function parse(t){return t.split(/\r?\n/).map(l=>parseFloat(l.split(",").pop())).filter(x=>!isNaN(x))}
function synth(n){let p=1,o=new Array(n);for(let i=0;i<n;i++){const u=Math.random(),v=Math.random();p*=Math.exp(0.0002*Math.sqrt(-2*Math.log(u+1e-12))*Math.cos(6.2832*v));o[i]=p}return o}
function rsi(p,i,n){if(i<n)return 50;let g=0,l=0;for(let k=i-n+1;k<=i;k++){const d=p[k]-p[k-1];d>0?g+=d:l-=d}return l===0?100:100-100/(1+g/l)}
function sig(p,i,lb,s){
 if(s==="rsi"){const r=rsi(p,i,14);return r<30?1:r>70?-1:0}
 if(i<lb)return 0;const d=p[i]-p[i-lb];const m=d>0?1:d<0?-1:0;return s==="mom"?m:-m}
$("file").onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>$("txt").value=t)};
$("go").onclick=()=>{
 const pr=$("txt").value.trim()?parse($("txt").value):synth(300000);
 const lb=+$("lb").value,s=$("strat").value,pay=+$("pay").value/100,T=+$("tgt").value,E=10;
 let w=0,n=0,i=Math.max(lb,15);
 while(i+E<pr.length){const g=sig(pr,i,lb,s);if(g){const d=pr[i+E]-pr[i];if(d!==0){n++;if(d*g>0)w++}i+=E}else i++}
 if(!n){alert("Գործարք չկա");return}
 const wr=w/n,be=1/(1+pay),ev=wr*pay-(1-wr),ci=1.96*Math.sqrt(wr*(1-wr)/n);
 const need=Math.ceil(Math.log(T)/Math.log(1+pay)),pb=Math.pow(wr,need);
 const f=(x,d)=>x.toFixed(d);
 $("dl").innerHTML=`<dt>Տվյալ</dt><dd>${pr.length.toLocaleString()} վրկ${$("txt").value.trim()?"":" (սինթետիկ)"}</dd>
 <dt>Գործարք</dt><dd>${n.toLocaleString()}</dd>
 <dt>Win-rate</dt><dd>${f(wr*100,2)}% ±${f(ci*100,2)}</dd>
 <dt>Անհրաժեշտ win-rate</dt><dd>${f(be*100,2)}%</dd>
 <dt>EV / 1$</dt><dd class="${ev>0?"good":"bad"}">${ev>0?"+":""}${f(ev,4)}</dd>
 <dt>Անընդմեջ հաղթանակ 1$→${T}$</dt><dd>${need}</dd>
 <dt>Պարլեյի շանս</dt><dd>${(pb*100).toPrecision(2)}%</dd>`;
 $("out").hidden=false};
</script>
