<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Մենյու</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;600;700&family=Noto+Serif+Armenian:wght@600&display=swap" rel="stylesheet">
<script>
/* =====================================================================
   ՊԱՏՎԵՐԻ ՏՎՅԱԼՆԵՐ — նոր սրճարանի համար փոխիր ՄԻԱՅՆ այս բլոկը
   Ամեն տեքստ տրվում է 3 լեզվով՝ [հայերեն, русский, English]
   ===================================================================== */
const CONFIG = {
  name: "Կաֆե Լիմոն",
  tagline: ["Սուրճ, աղանդեր և նախաճաշ", "Кофе, десерты и завтраки", "Coffee, desserts & breakfast"],
  accent: "#c8553d",
  phone: "+374 00 000 000",
  address: ["Երևան, Աբովյան 1", "Ереван, Абовяна 1", "Yerevan, Abovyan 1"],
  hours: "09:00 – 23:00",
  instagram: "",                       // օր.՝ "cafe.limon" (առանց @)
  currency: "֏",
  categories: [
    { icon: "☕", name: ["Սուրճ", "Кофе", "Coffee"], items: [
      { name: ["Էսպրեսո", "Эспрессо", "Espresso"], price: 600 },
      { name: ["Ամերիկանո", "Американо", "Americano"], price: 700 },
      { name: ["Կապուչինո", "Капучино", "Cappuccino"], price: 900, desc: ["Կաթնային փրփուրով", "С молочной пенкой", "With milk foam"] },
      { name: ["Լատտե", "Латте", "Latte"], price: 1000 },
      { name: ["Հայկական սուրճ", "Армянский кофе", "Armenian coffee"], price: 500, tag: "hit" }
    ]},
    { icon: "🍳", name: ["Նախաճաշ", "Завтраки", "Breakfast"], items: [
      { name: ["Ձվածեղ բանջարեղենով", "Омлет с овощами", "Veggie omelette"], price: 1800 },
      { name: ["Բլիթներ մեղրով", "Блинчики с мёдом", "Pancakes with honey"], price: 1600, tag: "hit" },
      { name: ["Լավաշով նախաճաշ", "Завтрак с лавашом", "Lavash breakfast"], price: 2200, desc: ["Պանիր, կանաչի, ձու, լոլիկ", "Сыр, зелень, яйцо, томаты", "Cheese, herbs, egg, tomato"] }
    ]},
    { icon: "🍰", name: ["Աղանդեր", "Десерты", "Desserts"], items: [
      { name: ["Գաթա", "Гата", "Gata"], price: 900 },
      { name: ["Չիզքեյք", "Чизкейк", "Cheesecake"], price: 1500 },
      { name: ["Նապոլեոն", "Наполеон", "Napoleon"], price: 1300, tag: "new" }
    ]},
    { icon: "🥤", name: ["Ըմպելիքներ", "Напитки", "Drinks"], items: [
      { name: ["Թարմ նարինջ", "Свежий апельсин", "Fresh orange juice"], price: 1400 },
      { name: ["Լիմոնադ", "Лимонад", "Lemonade"], price: 1100, desc: ["Տնական, անանուխով", "Домашний, с мятой", "Homemade, with mint"] },
      { name: ["Թեյ", "Чай", "Tea"], price: 600 },
      { name: ["Ջերմուկ", "Джермук", "Jermuk"], price: 500 }
    ]}
  ]
};
</script>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#2a2420;--muted:#857a70;--line:#ece4d9;--accent:#c8553d}
@media (prefers-color-scheme:dark){:root{--bg:#171412;--card:#221e1b;--ink:#f2ece5;--muted:#a3978b;--line:#352f2a}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans Armenian",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
header{padding:28px 16px 18px;text-align:center}
header h1{font-family:"Noto Serif Armenian",serif;font-size:30px;color:var(--accent)}
header p{color:var(--muted);font-size:14px;margin-top:4px}
.langs{display:inline-flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;margin-top:14px}
.langs button{border:0;background:none;color:var(--muted);font:600 13px inherit;font-family:inherit;padding:7px 14px;border-radius:999px;cursor:pointer}
.langs button.on{background:var(--accent);color:#fff}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:14px;white-space:nowrap}
nav a.on{border-color:var(--accent);color:var(--accent);font-weight:600}
main{max-width:640px;margin:0 auto;padding:8px 16px 40px}
.cat{scroll-margin-top:64px;padding-top:22px}
.cat h2{font-size:20px;margin-bottom:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:8px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.item b{font-weight:600}
.item small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.price{font-weight:700;color:var(--accent);white-space:nowrap}
.tag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:2px;background:var(--accent);color:#fff}
.tag.new{background:#3d8b5a}
footer{text-align:center;color:var(--muted);font-size:13px;padding:24px 16px 40px;line-height:1.9;border-top:1px solid var(--line)}
footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<header>
  <h1 id="name"></h1>
  <p id="tagline"></p>
  <div class="langs" id="langs"></div>
</header>
<nav id="nav"></nav>
<main id="menu"></main>
<footer id="foot"></footer>

<script>
const C = CONFIG, $ = id => document.getElementById(id);
document.documentElement.style.setProperty("--accent", C.accent);
const LANGS = [["hy","ՀԱՅ"],["ru","РУС"],["en","ENG"]];
const T = { hit:["Հիթ","Хит","Hit"], new:["Նոր","Новинка","New"], hours:["Աշխատում ենք","Работаем","Open"] };
let L = 0;
try { const s = localStorage.getItem("lang"); if (s !== null) L = +s; } catch(e) {}

function render(){
  document.documentElement.lang = LANGS[L][0];
  document.title = C.name + " — " + ["Մենյու","Меню","Menu"][L];
  $("name").textContent = C.name;
  $("tagline").textContent = C.tagline[L];
  $("langs").innerHTML = LANGS.map((l,i) => `<button class="${i===L?"on":""}" data-l="${i}">${l[1]}</button>`).join("");
  $("nav").innerHTML = C.categories.map((c,i) => `<a href="#c${i}" data-i="${i}">${c.icon} ${c.name[L]}</a>`).join("");
  $("menu").innerHTML = C.categories.map((c,i) => `
    <section class="cat" id="c${i}"><h2>${c.icon} ${c.name[L]}</h2>
    ${c.items.map(it => `<div class="item"><div><b>${it.name[L]}</b>${it.tag?`<span class="tag ${it.tag}">${T[it.tag][L]}</span>`:""}
      ${it.desc?`<small>${it.desc[L]}</small>`:""}</div>
      <div class="price">${it.price.toLocaleString("ru-RU")} ${C.currency}</div></div>`).join("")}
    </section>`).join("");
  $("foot").innerHTML = `${C.address[L]}<br>${T.hours[L]}: ${C.hours}<br>
    <a href="tel:${C.phone.replace(/\s/g,"")}">${C.phone}</a>
    ${C.instagram?`<br><a href="https://instagram.com/${C.instagram}" target="_blank" rel="noopener">@${C.instagram}</a>`:""}`;
  observe();
}
$("langs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  L = +b.dataset.l; try { localStorage.setItem("lang", L); } catch(e) {}
  render();
});

let io;
function observe(){
  io && io.disconnect();
  io = new IntersectionObserver(es => es.forEach(x => {
    if (!x.isIntersecting) return;
    const i = x.target.id.slice(1);
    document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.i === i));
    document.querySelector(`nav a[data-i="${i}"]`)?.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
  }), {rootMargin:"-70px 0px -60% 0px"});
  document.querySelectorAll(".cat").forEach(s => io.observe(s));
}
render();
</script>
</body>
</html>
